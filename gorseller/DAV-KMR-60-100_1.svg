<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #111827; font-family: &#39;Segoe UI&#39;, Roboto, monospace;">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1f2937" stroke-width="0.8" />
    </pattern>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid)" />
  
  <rect x="20" y="18" width="760" height="36" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="35" y="41" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="0.5">AVŞAR KROM | KÖMÜRLÜ DAVLUMBAZ (430 KALİTE - ARKASI DÜZ)</text>
  <text x="505" y="41" fill="#38bdf8" font-size="11" font-weight="bold">KOD: DAV-KMR-430-60_1</text>

  <!-- ÖN GÖRÜNÜŞ -->
  <text x="180" y="85" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>
  <rect x="145" y="120" width="70" height="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
  <polygon points="145,128 215,128 280,212 80,212" fill="#1e293b" fill-opacity="0.6" stroke="#f8fafc" stroke-width="2" />
  <rect x="80" y="212" width="200" height="18" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
  <text x="122" y="224" fill="#94a3b8" font-size="7" font-weight="bold" letter-spacing="0.8">AVŞAR KROM</text>
  <rect x="80" y="230" width="200" height="90" fill="#0f172a" fill-opacity="0.4" stroke="#64748b" stroke-width="1" />
  <rect x="80" y="230" width="10" height="90" fill="#1e293b" stroke="#f8fafc" stroke-width="2" />
  <rect x="270" y="230" width="10" height="90" fill="#1e293b" stroke="#f8fafc" stroke-width="2" />
  <line x1="65" y1="320" x2="295" y2="320" stroke="#475569" stroke-width="2" stroke-dasharray="6,3" />

  <!-- ÖLÇÜLER -->
  <line x1="55" y1="122" x2="55" y2="318" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <rect x="36" y="198" width="20" height="48" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
  <text x="49" y="222" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90, 49, 222)">950 mm</text>

  <line x1="82" y1="348" x2="278" y2="348" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <rect x="148" y="338" width="64" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
  <text x="180" y="351" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">1000 mm</text>

  <!-- YAN GÖRÜNÜŞ -->
  <text x="470" y="85" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">YAN GÖRÜNÜŞ (SIDE VIEW - DÜZ SIRT)</text>
  <rect x="425" y="120" width="45" height="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
  <polygon points="410,212 425,128 470,128 530,212" fill="#1e293b" fill-opacity="0.6" stroke="#f8fafc" stroke-width="2" />
  <rect x="410" y="212" width="120" height="18" fill="#0f172a" stroke="#f8fafc" stroke-width="2" />
  <!-- Düz Sırt Sacı -->
  <line x1="410" y1="230" x2="410" y2="320" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="410" y="230" width="120" height="90" fill="#1e293b" fill-opacity="0.7" stroke="#f8fafc" stroke-width="2" />

  <line x1="412" y1="348" x2="528" y2="348" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
  <rect x="442" y="338" width="56" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
  <text x="470" y="351" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">600 mm</text>

  <!-- ÖZELLİKLER PANELİ -->
  <rect x="575" y="105" width="205" height="245" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="590" y="128" fill="#38bdf8" font-size="12" font-weight="bold">YAPISAL ÖZELLİKLER</text>
  <line x1="590" y1="136" x2="765" y2="136" stroke="#334155" stroke-width="1" />
  
  <text x="590" y="158" fill="#e2e8f0" font-size="10.5">• Ürün: Kömürlü Izgara Davlumbazı</text>
  <text x="590" y="180" fill="#e2e8f0" font-size="10.5">• Çelik: AISI 430 Kalite Paslanmaz</text>
  <text x="590" y="202" fill="#e2e8f0" font-size="10.5">• Sırt Yapısı: Arkası Düz (Duvar Tip)</text>
  <text x="590" y="224" fill="#e2e8f0" font-size="10.5">• Ölçü: 1000 x 600 x 950 mm</text>
  <text x="590" y="246" fill="#e2e8f0" font-size="10.5">• Üst Şapka: Piramit Tip</text>
  <text x="590" y="268" fill="#e2e8f0" font-size="10.5">• Yüzey: No.4 Satine Fırçalı</text>
  <text x="590" y="290" fill="#e2e8f0" font-size="10.5">• Montaj: Doğrudan Duvara Oturtma</text>
  <text x="590" y="312" fill="#e2e8f0" font-size="10.5">• Seri Kodu: DAV-KMR-430-60_1</text>

  <text x="400" y="485" fill="#64748b" font-size="10" text-anchor="middle">Ölçüler milimetre (mm) cinsindendir. Avşar Krom Endüstriyel Mutfak Sistemleri.</text>
</svg>