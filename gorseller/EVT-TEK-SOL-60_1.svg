<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color:#111827; font-family:&#39;Segoe UI&#39;, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Başlık Bloğu -->
  <text x="30" y="38" fill="#f9fafb" font-size="16" font-weight="bold" letter-spacing="0.5">AVŞAR KROM — TEKNİK ŞEMA (BLUEPRINT)</text>
  <text x="30" y="58" fill="#38bdf8" font-size="13" font-weight="600">KOD: EVT-TEK-SOL-60_1 | ÖLÇÜ: 2005 × 585 × 850 mm (SOLDA TEK EVYELİ - TABAN RAFSIZ)</text>
  <line x1="30" y1="68" x2="770" y2="68" stroke="#374151" stroke-width="1.5" />

  <!-- ================= ÖN GÖRÜNÜŞ (FRONT VIEW) ================= -->
  <text x="215" y="95" fill="#9ca3af" font-size="12" font-weight="bold" text-anchor="middle">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>

  <!-- Arka Sırt (60 mm) -->
  <rect x="50" y="132" width="330" height="14" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.8" />
  <!-- Üst Tabla (40 mm) -->
  <rect x="50" y="146" width="330" height="10" fill="#374151" stroke="#f9fafb" stroke-width="2" />
  <!-- Ön Kuşak Sacı (280 mm derinlik) -->
  <rect x="60" y="156" width="310" height="65" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.8" />
  <!-- Soğuk Damga Logo -->
  <text x="72" y="172" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1">AVŞAR KROM</text>
  <!-- Gizli Evye Haznesi İzdüşümü (Solda) -->
  <rect x="76" y="156" width="80" height="58" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Sol ve Sağ 40x40 Ayaklar -->
  <rect x="50" y="156" width="10" height="190" fill="#374151" stroke="#e5e7eb" stroke-width="1.8" />
  <rect x="370" y="156" width="10" height="190" fill="#374151" stroke="#e5e7eb" stroke-width="1.8" />
  <!-- Siyah Rotil Ayaklar -->
  <rect x="49" y="346" width="12" height="6" fill="#090d16" stroke="#9ca3af" stroke-width="1.2" />
  <rect x="369" y="346" width="12" height="6" fill="#090d16" stroke="#9ca3af" stroke-width="1.2" />

  <!-- Yan Alt Kayıt İzdüşümü -->
  <rect x="50" y="310" width="10" height="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="370" y="310" width="10" height="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="215" y="295" fill="#64748b" font-size="11" text-anchor="middle">ALT KISIM AÇIK (TABAN RAFSIZ)</text>

  <!-- Boy: 2005 mm -->
  <line x1="50" y1="380" x2="380" y2="380" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="50" y1="355" x2="50" y2="388" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="380" y1="355" x2="380" y2="388" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="215" y="373" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">2005 mm</text>

  <!-- Yükseklik: 850 mm -->
  <line x1="30" y1="146" x2="30" y2="352" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="22" y1="146" x2="47" y2="146" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="22" y1="352" x2="47" y2="352" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="24" y="252" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 24,252)">850 mm</text>

  <!-- ================= ÜST GÖRÜNÜŞ (TOP / PLAN VIEW) ================= -->
  <text x="585" y="95" fill="#9ca3af" font-size="12" font-weight="bold" text-anchor="middle">ÜST GÖRÜNÜŞ (TOP PLAN VIEW)</text>

  <!-- Üst Tabla Dış Çerçeve (2005 x 585 mm) -->
  <rect x="420" y="146" width="330" height="117" fill="#1e293b" stroke="#f9fafb" stroke-width="2" />
  <!-- Arka Sırt -->
  <rect x="420" y="146" width="330" height="10" fill="#334155" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Su Taşma Kordonu -->
  <rect x="428" y="162" width="314" height="93" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" />

  <!-- Solda Tek Evye Haznesi -->
  <rect x="444" y="170" width="80" height="76" rx="10" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.8" />
  <circle cx="484" cy="208" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="484" cy="208" r="2" fill="#38bdf8" />
  <circle cx="484" cy="163" r="3.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="484" y="226" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">EVYE (SOL)</text>
  <text x="635" y="212" fill="#94a3b8" font-size="11" text-anchor="middle">DÜZ TABLA (OLUKSUZ)</text>

  <!-- En: 585 mm -->
  <line x1="768" y1="146" x2="768" y2="263" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="750" y1="146" x2="775" y2="146" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="750" y1="263" x2="775" y2="263" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="781" y="206" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 781,206)">585 mm</text>

  <!-- Teknik Bilgi Kutusu -->
  <rect x="420" y="305" width="330" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="435" y="325" fill="#e2e8f0" font-size="11" font-weight="bold">YAPISAL ÖZELLİKLER (AISI 304):</text>
  <text x="435" y="343" fill="#94a3b8" font-size="11">• Üst Tabla: Su taşma kordonlu düz tabla, 60 mm arka sırt</text>
  <text x="435" y="359" fill="#94a3b8" font-size="11">• Gövde: 3 tarafı derin kuşak saclı, solda tek evye + batarya deliği</text>
  <text x="435" y="375" fill="#94a3b8" font-size="11">• Şase: 40×40 mm profil ayak, yan H-kayıtlı, taban rafsız</text>
</svg>