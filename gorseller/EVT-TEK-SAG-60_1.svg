<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #111827; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Kılavuz Izgara (Grid) -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1"/>
    </pattern>
    <!-- Ölçü Okları -->
    <marker id="arrowStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Üst Başlık Bandı -->
  <rect x="20" y="16" width="760" height="44" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="36" y="36" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="0.8">AVŞAR KROM | TEKNİK ŞEMA (BLUEPRINT)</text>
  <text x="36" y="52" fill="#94a3b8" font-size="11">MODEL: EVT-TEK-SAG-60_1 | SAĞDA TEK EVYELİ TEZGAH (U-KAYITLI, TABAN RAFSIZ)</text>
  <text x="764" y="43" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="end">1500 × 600 × 850 mm</text>

  <!-- ========================================================= -->
  <!-- 1. ÖN GÖRÜNÜŞ (FRONT VIEW) - Ölçek: 1 mm = 0.22 px         -->
  <!-- ========================================================= -->
  <g transform="translate(55, 115)">
    <text x="165" y="-18" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.6">ÖN GÖRÜNÜŞ (KARŞIDAN BAKIŞ)</text>

    <!-- 60 mm Arka Sırt (Backsplash) - 13.2 px -->
    <rect x="0" y="0" width="330" height="13.2" fill="#334155" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- 40 mm Üst Tabla Ön Büküm - 8.8 px -->
    <rect x="0" y="13.2" width="330" height="8.8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- 200 mm Ön Kuşak Sacı (Apron) - 44 px -->
    <rect x="8.8" y="22" width="312.4" height="44" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.3"/>
    <!-- AVŞAR KROM Soğuk Damga Logo (Sol Üst Köşe, Tek Satır, Çerçevesiz) -->
    <text x="18" y="34" fill="#94a3b8" font-size="7.5" font-weight="700" letter-spacing="1.2">AVŞAR KROM</text>

    <!-- Sağda Gömülü Evye Haznesi (400x400x250 mm) Gizli Çizgi Gösterimi (250 mm = 55 px) -->
    <rect x="220" y="22" width="88" height="55" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="4,3"/>
    <text x="264" y="54" fill="#38bdf8" font-size="8.5" text-anchor="middle">EVYE (h:250)</text>

    <!-- Sol ve Sağ 40x40 mm Kare Profil Ayaklar (8.8 px genişlik, 850 mm = 187 px yükseklik) -->
    <rect x="0" y="22" width="8.8" height="173.8" fill="#334155" stroke="#e2e8f0" stroke-width="1.3"/>
    <rect x="321.2" y="22" width="8.8" height="173.8" fill="#334155" stroke="#e2e8f0" stroke-width="1.3"/>

    <!-- Ayarlanabilir Siyah Rotil Pabuçlar -->
    <rect x="1.4" y="195.8" width="6" height="4.4" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="322.6" y="195.8" width="6" height="4.4" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>

    <!-- Arka U-Çevre Kayıt Profili (Yerden 150 mm = 33 px yukarıda, önü açık, arkadan geçen 40 mm profil) -->
    <rect x="8.8" y="158.4" width="312.4" height="8.8" fill="#1e293b" stroke="#64748b" stroke-width="1.1" stroke-dasharray="6,3"/>
    <text x="165" y="153" fill="#94a3b8" font-size="8.5" text-anchor="middle">ARKA KAYIT PROFİLİ (ÖNÜ AÇIK U-ŞASE)</text>

    <!-- Zemin Çizgisi -->
    <line x1="-15" y1="200.2" x2="345" y2="200.2" stroke="#475569" stroke-width="1.5"/>

    <!-- Ölçülendirme: Boy (1500 mm) -->
    <line x1="0" y1="224" x2="330" y2="224" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="0" y1="202" x2="0" y2="230" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="330" y1="202" x2="330" y2="230" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="165" y="240" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1500 mm</text>

    <!-- Ölçülendirme: Yükseklik (850 mm) + Sırt (60 mm) -->
    <line x1="-22" y1="13.2" x2="-22" y2="200.2" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="-28" y1="13.2" x2="0" y2="13.2" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="-28" y1="200.2" x2="0" y2="200.2" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="-28" y="110" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle" transform="rotate(-90 -28,110)">850 mm (+60 mm Sırt)</text>

    <!-- Ölçülendirme: Ön Kuşak (200 mm) ve Alt Kayıt Yüksekliği (150 mm) -->
    <text x="338" y="48" fill="#cbd5e1" font-size="9">200 mm Kuşak</text>
    <text x="338" y="185" fill="#94a3b8" font-size="9">150 mm Kayıt</text>
  </g>

  <!-- ========================================================= -->
  <!-- 2. ÜST GÖRÜNÜŞ / PLAN (TOP VIEW) - Ölçek: 1 mm = 0.22 px   -->
  <!-- ========================================================= -->
  <g transform="translate(435, 115)">
    <text x="165" y="-18" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.6">ÜST GÖRÜNÜŞ (PLAN VE U-KAYIT İZDÜŞÜMÜ)</text>

    <!-- Üst Tabla Dış Çerçeve (1500 x 600 mm -> 330 x 132 px) -->
    <rect x="0" y="0" width="330" height="132" fill="#1e293b" stroke="#f8fafc" stroke-width="1.6"/>

    <!-- 60 mm Arka Sırt (Üst Kısımda Duvara Yaslı) -->
    <rect x="0" y="0" width="330" height="13.2" fill="#334155" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="165" y="10" fill="#94a3b8" font-size="8" text-anchor="middle">60 mm ARKA SIRT (DUVAR TARAFI)</text>

    <!-- Alt U-Çevre Kayıt Profili İzdüşümü (Sol, Arka ve Sağ dolu; Ön açık) -->
    <path d="M 6 126 L 6 18 L 324 18 L 324 126" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="115" y="118" fill="#fbbf24" font-size="8.5" font-weight="600" text-anchor="middle">40×40 U-ÇEVRE KAYIT (ÖN AÇIK)</text>

    <!-- Sol Çalışma / Hazırlık Alanı -->
    <text x="108" y="72" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">DÜZ ÇALIŞMA ALANI</text>

    <!-- Sağda Tek Evye Haznesi: 400 x 400 mm (88 x 88 px) -->
    <rect x="220" y="25" width="88" height="88" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <!-- Evye İç Kademe ve Gider Deliği -->
    <rect x="226" y="31" width="76" height="76" rx="4" fill="none" stroke="#334155" stroke-width="0.9"/>
    <line x1="220" y1="25" x2="256" y2="61" stroke="#1e293b" stroke-width="1"/>
    <line x1="308" y1="25" x2="272" y2="61" stroke="#1e293b" stroke-width="1"/>
    <line x1="220" y1="113" x2="256" y2="77" stroke="#1e293b" stroke-width="1"/>
    <line x1="308" y1="113" x2="272" y2="77" stroke="#1e293b" stroke-width="1"/>
    <circle cx="264" cy="69" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="264" cy="69" r="2.5" fill="#38bdf8"/>
    <text x="264" y="103" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">400 × 400 mm</text>

    <!-- Ölçülendirme: En / Derinlik (600 mm) -->
    <line x1="348" y1="0" x2="348" y2="132" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="330" y1="0" x2="354" y2="0" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="330" y1="132" x2="354" y2="132" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="362" y="66" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(90 362,66)">600 mm</text>

    <!-- Ölçülendirme: Evye Genişliği (400 mm) -->
    <line x1="220" y1="152" x2="308" y2="152" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <line x1="220" y1="113" x2="220" y2="158" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="308" y1="113" x2="308" y2="158" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <text x="264" y="168" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">400 mm (SAĞ EVYE)</text>

    <!-- Teknik Bilgi Kutusu -->
    <rect x="0" y="190" width="330" height="58" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="208" fill="#f8fafc" font-size="10" font-weight="700">YAPISAL ÖZELLİKLER:</text>
    <text x="12" y="223" fill="#cbd5e1" font-size="9.5">• Malzeme: AISI 304 Kalite 1.20 mm Satine Paslanmaz Çelik</text>
    <text x="12" y="238" fill="#cbd5e1" font-size="9.5">• Evye: 400×400×250 mm (Sağda) | Alt Şase: 40×40 mm U-Kayıt (Rafsız)</text>
  </g>
</svg>