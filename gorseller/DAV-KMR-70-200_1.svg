    <line x1="240" y1="0" x2="324" y2="122" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="0" y="122" width="350" height="24" fill="#374151" stroke="#e5e7eb" stroke-width="2"/>
    <text x="16" y="138" fill="#d1d5db" font-size="9.5" font-weight="700" letter-spacing="1.8">AVŞAR KROM</text>

