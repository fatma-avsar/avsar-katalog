  </defs>

  <rect width="800" height="500" fill="url(#gm-70-200)"/>
  <rect x="20" y="16" width="760" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="35" y="42" fill="#f9fafb" font-size="14.5" font-weight="700" letter-spacing="0.6">TEKNİK ŞEMA // DAV-KMR-70-200_1 KÖMÜRLÜ IZGARA DAVLUMBAZI</text>
  <text x="765" y="42" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="end">ÖLÇÜ: 2000 × 700 × 1150 mm</text>

