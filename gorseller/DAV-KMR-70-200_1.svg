    <line x1="266" y1="94" x2="290" y2="94" stroke="#4b5563" stroke-width="1"/>
    <line x1="280" y1="4" x2="280" y2="90" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-200)" marker-end="url(#ae-70-200)"/>
    <rect x="248" y="37" width="64" height="20" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="280" y="51" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">700 mm</text>

    <line x1="4" y1="118" x2="260" y2="118" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-200)" marker-end="url(#ae-70-200)"/>
    <rect x="92" y="108" width="80" height="19" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="132" y="121" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2000 mm</text>
  </g>

  <g transform="translate(485, 310)">
    <rect x="0" y="0" width="280" height="115" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.6">MODEL: DAV-KMR-70-200_1</text>
    <line x1="16" y1="32" x2="264" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="16" y="52" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Ölçüler:</tspan> 2000 × 700 × 1150 mm</text>
    <text x="16" y="72" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Malzeme:</tspan> AISI 430 Kalite Paslanmaz Çelik</text>
    <text x="16" y="92" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Yapı:</tspan> 2 Metre &amp; 70'lik Derin Seri</text>
    <text x="16" y="108" fill="#9ca3af" font-size="10.5" font-style="italic">* Büyük restoran ve kebap salonları için 2 metrelik seri.</text>
  </g>

  <line x1="20" y1="455" x2="780" y2="455" stroke="#374151" stroke-width="1"/>
  <text x="25" y="476" fill="#6b7280" font-size="11" font-weight="600">AVŞAR KROM ENDÜSTRİYEL MUTFAK EKİPMANLARI // CAD BLUEPRINT SİSTEMİ</text>
  <text x="775" y="476" fill="#6b7280" font-size="11" font-weight="600" text-anchor="end">KOD: DAV-KMR-70-200_1 | ÖLÇEK: MM</text>
</svg>