    <rect x="338" y="146" width="12" height="122" fill="#374151" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="-15" y1="268" x2="365" y2="268" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4"/>

