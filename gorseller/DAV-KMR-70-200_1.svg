    <line x1="-36" y1="268" x2="0" y2="268" stroke="#4b5563" stroke-width="1"/>
    <line x1="-26" y1="4" x2="-26" y2="264" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-200)" marker-end="url(#ae-70-200)"/>
    <rect x="-64" y="123" width="76" height="22" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="-26" y="138" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">1150 mm</text>
  </g>

