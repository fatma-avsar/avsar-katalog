<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #111827; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; border: 1px solid #1f2937;">
  <defs>
    <pattern id="g-70-200" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.7"/>
    </pattern>
    <pattern id="gm-70-200" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#g-70-200)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1.1"/>
    </pattern>
    <linearGradient id="sp-70-200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4b5563" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sc-70-200" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75"/>
    </linearGradient>
    <marker id="as-70-200" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ae-70-200" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
