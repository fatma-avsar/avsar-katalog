    <line x1="0" y1="270" x2="0" y2="306" stroke="#4b5563" stroke-width="1"/>
    <line x1="350" y1="270" x2="350" y2="306" stroke="#4b5563" stroke-width="1"/>
    <line x1="4" y1="296" x2="346" y2="296" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-200)" marker-end="url(#ae-70-200)"/>
