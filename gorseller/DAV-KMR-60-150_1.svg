    <line x1="-42" y1="276" x2="0" y2="276" stroke="#4b5563" stroke-width="1"/>
    <line x1="-32" y1="4" x2="-32" y2="272" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-60-150)" marker-end="url(#ae-60-150)"/>
    <rect x="-70" y="127" width="76" height="22" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="-32" y="142" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">1150 mm</text>

    <line x1="322" y1="126" x2="352" y2="126" stroke="#4b5563" stroke-width="1"/>
    <line x1="322" y1="152" x2="352" y2="152" stroke="#4b5563" stroke-width="1"/>
    <line x1="322" y1="276" x2="352" y2="276" stroke="#4b5563" stroke-width="1"/>
