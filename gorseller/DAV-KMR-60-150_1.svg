    <text x="275" y="55" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">600 mm</text>

    <line x1="4" y1="125" x2="251" y2="125" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-60-150)" marker-end="url(#ae-60-150)"/>
    <rect x="87" y="115" width="80" height="19" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="127" y="128" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1500 mm</text>
  </g>

  <g transform="translate(485, 310)">
    <rect x="0" y="0" width="280" height="115" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.6">MODEL: DAV-KMR-60-150_1</text>
    <line x1="16" y1="32" x2="264" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="16" y="52" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Ölçüler:</tspan> 1500 × 600 × 1150 mm</text>
    <text x="16" y="72" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Malzeme:</tspan> AISI 430 Kalite Paslanmaz Çelik</text>
    <text x="16" y="92" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Yapı:</tspan> 60'lık Seri, 1150 mm Yüksek Kubbe</text>
    <text x="16" y="108" fill="#9ca3af" font-size="10.5" font-style="italic">* 150 cm kömürlü ızgaralar için yüksek çekişli tasarım.</text>
  </g>

  <line x1="20" y1="455" x2="780" y2="455" stroke="#374151" stroke-width="1"/>
  <text x="25" y="476" fill="#6b7280" font-size="11" font-weight="600">AVŞAR KROM ENDÜSTRİYEL MUTFAK EKİPMANLARI // CAD BLUEPRINT SİSTEMİ</text>
  <text x="775" y="476" fill="#6b7280" font-size="11" font-weight="600" text-anchor="end">KOD: DAV-KMR-60-150_1 | ÖLÇEK: MM</text>
</svg>