    <line x1="257" y1="102" x2="285" y2="102" stroke="#4b5563" stroke-width="1"/>
    <line x1="275" y1="4" x2="275" y2="98" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-60-150)" marker-end="url(#ae-60-150)"/>
