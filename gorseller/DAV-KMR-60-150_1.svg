    <line x1="320" y1="278" x2="320" y2="312" stroke="#4b5563" stroke-width="1"/>
    <line x1="4" y1="302" x2="316" y2="302" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-60-150)" marker-end="url(#ae-60-150)"/>
