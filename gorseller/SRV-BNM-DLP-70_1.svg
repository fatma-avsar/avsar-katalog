<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" style="background-color: #111827; font-family: &#39;Segoe UI&#39;, Roboto, monospace;">
  <defs>
    <!-- Ölçü Okları -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-amber-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-amber-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-green-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-green-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <!-- Arka Plan Izgara Deseni -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1F2937" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Arka Plan -->
  <rect width="960" height="640" fill="url(#grid)" />
  <rect x="10" y="10" width="940" height="620" fill="none" stroke="#374151" stroke-width="1.5" rx="6" />

  <!-- ÜST BAŞLIK BLOĞU -->
  <rect x="20" y="20" width="920" height="44" fill="#1E293B" stroke="#334155" stroke-width="1" rx="4" />
  <text x="35" y="47" fill="#F8FAFC" font-size="15" font-weight="bold" letter-spacing="1">AVŞAR KROM | TEKNİK ŞEMA (BLUEPRINT)</text>
  <text x="925" y="47" fill="#38BDF8" font-size="14" font-weight="bold" text-anchor="end">KOD: SRV-BNM-DLP-70_1</text>

  <!-- ========================================================= -->
  <!-- 1. ÖN GÖRÜNÜŞ (OPERATÖR / KAPAK CEPHESİ) - SOL ÜST        -->
  <!-- Ölçek: 1 mm = 0.25 px (1420 mm = 355 px, 1300 mm = 325 px)-->
  <!-- ========================================================= -->
  <g transform="translate(75, 100)">
    <text x="177" y="-15" fill="#94A3B8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.8">ÖN GÖRÜNÜŞ (OPERATÖR CEPHESİ)</text>

    <!-- Üst Servis Rafı (455 mm = 114 px) -->
    <rect x="0" y="0" width="355" height="12" fill="#334155" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="177.5" y="9" fill="#CBD5E1" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="2">AVŞAR KROM</text>
    <!-- Üst Raf Dikmeleri (40x40 mm) -->
    <rect x="12" y="12" width="10" height="102" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="172.5" y="12" width="10" height="102" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="333" y="12" width="10" height="102" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Ana Tezgah Gövdesi (850 mm = 212.5 px -> Y: 114'ten 326.5'e) -->
    <rect x="0" y="114" width="355" height="10" fill="#334155" stroke="#F8FAFC" stroke-width="1.5" />
    
    <!-- Gövde Dış Çerçeve ve 40x40 Ayak Dikmeleri -->
    <rect x="0" y="124" width="10" height="190" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="345" y="124" width="10" height="190" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.2" />
    
    <!-- Rotil Ayaklar -->
    <rect x="2" y="314" width="6" height="12" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1" />
    <rect x="347" y="314" width="6" height="12" fill="#94A3B8" stroke="#E2E8F0" stroke-width="1" />

    <!-- Ön Alın Paneli (Havuz Gizleme Bandı) -->
    <rect x="10" y="124" width="335" height="48" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.2" />
    <!-- Termostat Düğmesi (Sağda) -->
    <circle cx="330" cy="148" r="5" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
    <text x="318" y="151" fill="#F59E0B" font-size="8" text-anchor="end">220V Termostat</text>

    <!-- Havuz İçi Gizli Çizgisi (1300 mm = 325 px, Derinlik 230 mm = 57.5 px) -->
    <rect x="15" y="114" width="325" height="57.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4,3" />
    <text x="22" y="136" fill="#38BDF8" font-size="9">Havuz İçi: 1300 mm (Derinlik: 230 mm)</text>

    <!-- Rezistans (880 mm = 220 px) -->
    <rect x="67.5" y="164" width="220" height="4" fill="#EF4444" opacity="0.85" rx="2" />
    <text x="177.5" y="161" fill="#FCA5A5" font-size="8.5" text-anchor="middle">Sulu Rezistans: 880 mm (220V)</text>

    <!-- Yan Küresel Tahliye Vanası -->
    <rect x="355" y="162" width="10" height="6" fill="#F59E0B" stroke="#FDE68A" stroke-width="1" />
    <line x1="365" y1="165" x2="372" y2="156" stroke="#EF4444" stroke-width="2" />
    <text x="368" y="177" fill="#F59E0B" font-size="8">Küresel Vana</text>

    <!-- Alt Nötr Dolap Çift Menteşeli Kapaklar -->
    <rect x="10" y="172" width="167.5" height="125" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.4" />
    <rect x="177.5" y="172" width="167.5" height="125" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.4" />
    <!-- Gömme Dairesel Kulplar -->
    <circle cx="162" cy="195" r="8" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="193" cy="195" r="8" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="177.5" y="245" fill="#64748B" font-size="10" text-anchor="middle">NÖTR ALT DOLAP (ÇİFT KAPAKLI)</text>

    <!-- ÖLÇÜ ÇİZGİLERİ (ÖN GÖRÜNÜŞ) -->
    <!-- Toplam Boy: 1420 mm -->
    <line x1="0" y1="348" x2="355" y2="348" stroke="#38BDF8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="0" y1="328" x2="0" y2="354" stroke="#475569" stroke-width="0.8" />
    <line x1="355" y1="328" x2="355" y2="354" stroke="#475569" stroke-width="0.8" />
    <text x="177.5" y="362" fill="#38BDF8" font-size="11" font-weight="bold" text-anchor="middle">1420 mm</text>

    <!-- Sol Yükseklik Ölçüleri: 455 mm + 850 mm = 1300 mm -->
    <line x1="-22" y1="0" x2="-22" y2="114" stroke="#F59E0B" stroke-width="1.2" marker-start="url(#arrow-amber-start)" marker-end="url(#arrow-amber-end)" />
    <text x="-27" y="60" fill="#F59E0B" font-size="10" font-weight="bold" text-anchor="end">455 mm</text>

    <line x1="-22" y1="114" x2="-22" y2="326" stroke="#38BDF8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="-27" y="225" fill="#38BDF8" font-size="10" font-weight="bold" text-anchor="end">850 mm</text>

    <line x1="-58" y1="0" x2="-58" y2="326" stroke="#38BDF8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="-63" y1="0" x2="-2" y2="0" stroke="#475569" stroke-width="0.8" />
    <line x1="-63" y1="114" x2="-2" y2="114" stroke="#475569" stroke-width="0.8" />
    <line x1="-63" y1="326" x2="-2" y2="326" stroke="#475569" stroke-width="0.8" />
    <text x="-62" y="168" fill="#E2E8F0" font-size="10" font-weight="bold" text-anchor="end" transform="rotate(-90 -62,168)">TOPLAM: 1300 mm</text>
  </g>

  <!-- ========================================================= -->
  <!-- 2. YAN KESİT GÖRÜNÜŞÜ (PROFİL) - SAĞ ÜST                  -->
  <!-- Sol: Operatör (0) | Sağ: Müşteri / Tepsi Standı (176.25)  -->
  <!-- Üst Raf: Kaydırma standından 60mm (15px) içeride başlar   -->
  <!-- X: 85.0 px (340mm) -> X: 161.25 px (645mm) [Raf: 305mm]   -->
  <!-- ========================================================= -->
  <g transform="translate(560, 100)">
    <text x="125" y="-22" fill="#94A3B8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="0.8">YAN KESİT GÖRÜNÜŞ (340 + 305 + 60 = 705 mm)</text>

    <!-- Üst Servis Rafı (305 mm = 76.25 px | X: 85.0 -> 161.25) -->
    <rect x="85" y="0" width="76.25" height="12" fill="#334155" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Yan Dikmeler (Kare Profil) -->
    <rect x="85" y="12" width="10" height="102" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="151.25" y="12" width="10" height="102" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.2" />

    <!-- Üst Raf Konum Ölçüleri: 340 mm (Arka) | 305 mm (Üst Raf) | 60 mm (Ön Çekme) -->
    <!-- 340 mm Operatör Açıklığı -->
    <line x1="0" y1="-8" x2="85" y2="-8" stroke="#10B981" stroke-width="1" marker-start="url(#arrow-green-start)" marker-end="url(#arrow-green-end)" />
    <line x1="0" y1="-12" x2="0" y2="112" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2" />
    <text x="42.5" y="-12" fill="#10B981" font-size="9" font-weight="bold" text-anchor="middle">340 mm</text>

    <!-- 305 mm Üst Raf -->
    <line x1="85" y1="-8" x2="161.25" y2="-8" stroke="#F59E0B" stroke-width="1.2" marker-start="url(#arrow-amber-start)" marker-end="url(#arrow-amber-end)" />
    <line x1="85" y1="-12" x2="85" y2="-1" stroke="#475569" stroke-width="0.8" />
    <line x1="161.25" y1="-12" x2="161.25" y2="-1" stroke="#475569" stroke-width="0.8" />
    <text x="123" y="-12" fill="#F59E0B" font-size="9.5" font-weight="bold" text-anchor="middle">Üst Raf: 305 mm</text>

    <!-- 60 mm Kaydırma Standından İçeri Çekme Payı -->
    <line x1="161.25" y1="55" x2="176.25" y2="55" stroke="#10B981" stroke-width="1.2" />
    <line x1="176.25" y1="45" x2="176.25" y2="114" stroke="#10B981" stroke-width="0.9" stroke-dasharray="2,2" />
    <text x="182" y="58" fill="#10B981" font-size="9.5" font-weight="bold">60 mm (Standdan İçeri)</text>

    <!-- Ana Gövde Yan Profili (705 mm = 176.25 px) -->
    <rect x="0" y="114" width="176.25" height="183" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Ayaklar -->
    <rect x="0" y="297" width="10" height="29" fill="#334155" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="166.25" y="297" width="10" height="29" fill="#334155" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Havuz Kesiti (510 mm = 127.5 px, Derinlik 230 mm = 57.5 px) -->
    <rect x="24.3" y="114" width="127.5" height="57.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4" stroke-dasharray="4,2" />
    <text x="88" y="142" fill="#38BDF8" font-size="9" text-anchor="middle">Havuz: 510x230</text>
    <!-- Rezistans Kesiti -->
    <circle cx="88" cy="165" r="3.5" fill="#EF4444" />

    <!-- Katlanır 3 Borulu Tepsi Kaydırma Standı (Sağda/Müşteri Yönü: +300 mm = 75 px) -->
    <polygon points="176.25,120 251.25,120 251.25,128 176.25,165" fill="#334155" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="196" cy="116" r="4" fill="#E2E8F0" />
    <circle cx="220" cy="116" r="4" fill="#E2E8F0" />
    <circle cx="244" cy="116" r="4" fill="#E2E8F0" />
    <text x="218" y="105" fill="#38BDF8" font-size="8.5" text-anchor="middle">3 Borulu Katlanır Stand</text>

    <!-- Alt Ölçü Çizgileri: 705 mm + 300 mm = 1005 mm -->
    <line x1="0" y1="348" x2="176.25" y2="348" stroke="#38BDF8" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <line x1="176.25" y1="348" x2="251.25" y2="348" stroke="#F59E0B" stroke-width="1.2" marker-start="url(#arrow-amber-start)" marker-end="url(#arrow-amber-end)" />
    <line x1="0" y1="328" x2="0" y2="354" stroke="#475569" stroke-width="0.8" />
    <line x1="176.25" y1="299" x2="176.25" y2="354" stroke="#475569" stroke-width="0.8" />
    <line x1="251.25" y1="128" x2="251.25" y2="354" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2" />
    <text x="88" y="362" fill="#38BDF8" font-size="11" font-weight="bold" text-anchor="middle">705 mm</text>
    <text x="214" y="362" fill="#F59E0B" font-size="11" font-weight="bold" text-anchor="middle">+300 mm</text>
  </g>

  <!-- ========================================================= -->
  <!-- 3. ÜST PLAN GÖRÜNÜŞÜ (HAVUZ, ÜST RAF İZİ & TEPSİ STANDI)  -->
  <!-- ========================================================= -->
  <g transform="translate(75, 485)">
    <text x="0" y="-10" fill="#94A3B8" font-size="12" font-weight="bold" letter-spacing="0.8">ÜST PLAN GÖRÜNÜŞÜ (ÜST RAF İZDÜŞÜMÜ VE HAVUZ İÇİ)</text>

    <!-- Ana Tabla (1420 x 705 mm -> 355 x 90 px şematik plan) -->
    <rect x="0" y="0" width="355" height="90" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.5" />

    <!-- İç Havuz (1300 x 510 mm) -->
    <rect x="15" y="11" width="325" height="68" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />

    <!-- 4x GN 1/1 Küvet Bölüntüleri -->
    <line x1="96.25" y1="11" x2="96.25" y2="79" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="177.5" y1="11" x2="177.5" y2="79" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="258.75" y1="11" x2="258.75" y2="79" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />

    <!-- 880 mm Sulu Sistem Rezistans -->
    <rect x="67.5" y="32" width="220" height="16" fill="none" stroke="#EF4444" stroke-width="1.8" rx="8" />
    <text x="177.5" y="43" fill="#FCA5A5" font-size="8" font-weight="bold" text-anchor="middle">880 mm Rezistans (Havuz: 1300x510)</text>

    <!-- Üst Servis Rafı İzdüşümü (Kaydırma standından 60mm içeride, 305mm derinlik) -->
    <rect x="0" y="43" width="355" height="39" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="5,3" />
    <text x="177.5" y="76" fill="#FDE68A" font-size="8" font-weight="bold" text-anchor="middle">Üst Raf İzdüşümü (305 mm) — Standdan 60 mm İçeride Başlar</text>

    <!-- 3 Borulu Katlanır Tepsi Kaydırma Standı (300 mm) -->
    <rect x="0" y="90" width="355" height="34" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="0" y1="98" x2="355" y2="98" stroke="#CBD5E1" stroke-width="2.5" />
    <line x1="0" y1="107" x2="355" y2="107" stroke="#CBD5E1" stroke-width="2.5" />
    <line x1="0" y1="116" x2="355" y2="116" stroke="#CBD5E1" stroke-width="2.5" />
    <text x="177.5" y="136" fill="#38BDF8" font-size="10" font-weight="bold" text-anchor="middle">3 Borulu Katlanır Tepsi Kaydırma Standı (300 mm Derinlik)</text>
  </g>

  <!-- SAĞ ALT TEKNİK ÖZET KUTUSU -->
  <g transform="translate(520, 470)">
    <rect x="0" y="0" width="405" height="140" fill="#1E293B" stroke="#334155" stroke-width="1.2" rx="4" />
    <text x="15" y="22" fill="#38BDF8" font-size="11.5" font-weight="bold">TEKNİK SPESİFİKASYONLAR (SRV-BNM-DLP-70_1)</text>
    <text x="15" y="42" fill="#E2E8F0" font-size="10.5">• Gövde & Toplam Boyut: 1420 x 705 (+300) x 850 (+455) = 1300 mm</text>
    <text x="15" y="60" fill="#E2E8F0" font-size="10.5">• Havuz İç Ölçüsü: 1300 x 510 x 230 mm (4x GN 1/1 Kapasiteli)</text>
    <text x="15" y="78" fill="#E2E8F0" font-size="10.5">• Isıtma & Tahliye: 880 mm Sulu Rezistans (220V) / Yan Küresel Vana</text>
    <text x="15" y="96" fill="#FDE68A" font-size="10.5">• Üst Raf Konumu: Standdan 60 mm içeride, 305 mm derinlik (Arka: 340 mm)</text>
    <text x="15" y="114" fill="#E2E8F0" font-size="10.5">• Üst Yapı & Alt Dolap: Camsız Açık Raf (LED'siz) / Nötr Çift Kapaklı Dolap</text>
  </g>
</svg>