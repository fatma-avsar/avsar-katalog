<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color:#111827; font-family:&#39;Segoe UI&#39;, Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1f2937" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Başlık Bloğu -->
  <text x="30" y="38" fill="#f9fafb" font-size="16" font-weight="bold" letter-spacing="0.5">AVŞAR KROM — TEKNİK ŞEMA (BLUEPRINT)</text>
  <text x="30" y="58" fill="#38bdf8" font-size="13" font-weight="600">KOD: EVT-CFT-SAG-60_2 | ÖLÇÜ: 1750 × 600 × 850 mm (SAĞDA ÇİFT EVYELİ - TABAN RAFSIZ)</text>
  <line x1="30" y1="68" x2="770" y2="68" stroke="#374151" stroke-width="1.5" />

  <!-- ================= ÖN GÖRÜNÜŞ (FRONT VIEW) ================= -->
  <text x="215" y="95" fill="#9ca3af" font-size="12" font-weight="bold" text-anchor="middle">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>

  <!-- Arka Sırt (60 mm) -->
  <rect x="60" y="132" width="310" height="14" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.8" />
  <!-- Üst Tabla (40 mm) -->
  <rect x="60" y="146" width="310" height="10" fill="#374151" stroke="#f9fafb" stroke-width="2" />
  <!-- Ön Kuşak Sacı (280 mm derinlik) -->
  <rect x="70" y="156" width="290" height="65" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.8" />
  <!-- Soğuk Damga Logo -->
  <text x="81" y="172" fill="#94a3b8" font-size="9" font-weight="bold" letter-spacing="1">AVŞAR KROM</text>
  <!-- Gizli Çift Evye Haznesi İzdüşümü (Sağda 2 Adet) -->
  <rect x="204" y="156" width="68" height="58" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3" />
  <rect x="280" y="156" width="68" height="58" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3" />

  <!-- Sol ve Sağ 40x40 Ayaklar -->
  <rect x="60" y="156" width="10" height="190" fill="#374151" stroke="#e5e7eb" stroke-width="1.8" />
  <rect x="360" y="156" width="10" height="190" fill="#374151" stroke="#e5e7eb" stroke-width="1.8" />
  <!-- Siyah Rotil Ayaklar -->
  <rect x="59" y="346" width="12" height="6" fill="#090d16" stroke="#9ca3af" stroke-width="1.2" />
  <rect x="359" y="346" width="12" height="6" fill="#090d16" stroke="#9ca3af" stroke-width="1.2" />

  <!-- Yan Alt Kayıt İzdüşümü -->
  <rect x="60" y="310" width="10" height="8" fill="#475569" stroke="#cbd5e1" stroke-width="1.2" />
  <rect x="360" y="310" width="10" height="8" fill="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="215" y="295" fill="#64748b" font-size="11" text-anchor="middle">ALT KISIM AÇIK (TABAN RAFSIZ)</text>

  <!-- Boy: 1750 mm -->
  <line x1="60" y1="380" x2="370" y2="380" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="60" y1="355" x2="60" y2="388" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="370" y1="355" x2="370" y2="388" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="215" y="373" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">1750 mm</text>

  <!-- Yükseklik: 850 mm -->
  <line x1="36" y1="146" x2="36" y2="352" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="28" y1="146" x2="56" y2="146" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="28" y1="352" x2="56" y2="352" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="30" y="252" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 30,252)">850 mm</text>

  <!-- ================= ÜST GÖRÜNÜŞ (TOP / PLAN VIEW) ================= -->
  <text x="585" y="95" fill="#9ca3af" font-size="12" font-weight="bold" text-anchor="middle">ÜST GÖRÜNÜŞ (TOP PLAN VIEW)</text>

  <!-- Üst Tabla Dış Çerçeve (1750 x 600 mm) -->
  <rect x="430" y="146" width="310" height="120" fill="#1e293b" stroke="#f9fafb" stroke-width="2" />
  <!-- Arka Sırt -->
  <rect x="430" y="146" width="310" height="10" fill="#334155" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Su Taşma Kordonu -->
  <rect x="438" y="162" width="294" height="96" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" />

  <!-- Sağda Çift Evye Haznesi (1. ve 2. Göz) -->
  <rect x="574" y="172" width="68" height="78" rx="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.8" />
  <circle cx="608" cy="211" r="6.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="608" cy="211" r="2" fill="#38bdf8" />
  <circle cx="608" cy="164" r="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
  <text x="608" y="232" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">EVYE 1</text>

  <rect x="650" y="172" width="68" height="78" rx="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.8" />
  <circle cx="684" cy="211" r="6.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="684" cy="211" r="2" fill="#38bdf8" />
  <circle cx="684" cy="164" r="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
  <text x="684" y="232" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">EVYE 2</text>

  <text x="506" y="214" fill="#94a3b8" font-size="10" text-anchor="middle">DÜZ TABLA</text>

  <!-- En: 600 mm -->
  <line x1="760" y1="146" x2="760" y2="266" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="740" y1="146" x2="766" y2="146" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="740" y1="266" x2="766" y2="266" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="774" y="209" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 774,209)">600 mm</text>

  <!-- Teknik Bilgi Kutusu -->
  <rect x="430" y="305" width="310" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="445" y="325" fill="#e2e8f0" font-size="11" font-weight="bold">YAPISAL ÖZELLİKLER (AISI 304):</text>
  <text x="445" y="343" fill="#94a3b8" font-size="11">• Üst Tabla: Su taşma kordonlu düz tabla, 60 mm arka sırt</text>
  <text x="445" y="359" fill="#94a3b8" font-size="11">• Gövde: 3 tarafı derin kuşak saclı, sağda çift evye + batarya delikleri</text>
  <text x="445" y="375" fill="#94a3b8" font-size="11">• Şase: 40×40 mm profil ayak, yan H-kayıtlı, taban rafsız</text>
</svg>