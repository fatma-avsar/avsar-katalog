<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #111827; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; border: 1px solid #1f2937;">
  <defs>
    <pattern id="g-70-300" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.7"/>
    </pattern>
    <pattern id="gm-70-300" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#g-70-300)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1.1"/>
    </pattern>
    <linearGradient id="sp-70-300" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4b5563" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sc-70-300" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.75"/>
    </linearGradient>
    <marker id="as-70-300" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ae-70-300" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#gm-70-300)"/>
  <rect x="20" y="16" width="760" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="35" y="42" fill="#f9fafb" font-size="14.5" font-weight="700" letter-spacing="0.6">TEKNİK ŞEMA // DAV-KMR-70-300_1 3 METRE OCAKBAŞI DAVLUMBAZI</text>
  <text x="765" y="42" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="end">ÖLÇÜ: 3000 × 700 × 1200 mm</text>

  <!-- 1. ÖN GÖRÜNÜŞ (3000mm = 380px, 1200mm = 264px) -->
  <g transform="translate(50, 110)">
    <text x="190" y="-18" fill="#9ca3af" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>
    <polygon points="0,122 96,0 284,0 380,122" fill="url(#sp-70-300)" stroke="#e5e7eb" stroke-width="2" stroke-linejoin="round"/>
    <line x1="96" y1="0" x2="24" y2="122" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="284" y1="0" x2="356" y2="122" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="0" y="122" width="380" height="24" fill="#374151" stroke="#e5e7eb" stroke-width="2"/>
    <text x="16" y="138" fill="#d1d5db" font-size="9.5" font-weight="700" letter-spacing="1.8">AVŞAR KROM</text>

    <rect x="12" y="146" width="356" height="118" fill="url(#sc-70-300)" stroke="#6b7280" stroke-width="1"/>
    <line x1="12" y1="264" x2="44" y2="234" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="368" y1="264" x2="336" y2="234" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="44" y="146" width="292" height="88" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="190" y="208" fill="#6b7280" font-size="10.5" font-weight="600" text-anchor="middle">3 METRE TAM BOY OCAKBAŞI AĞZI (3000 × 700 × 1200 mm)</text>

    <rect x="0" y="146" width="12" height="118" fill="#374151" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="368" y="146" width="12" height="118" fill="#374151" stroke="#e5e7eb" stroke-width="2"/>
    <line x1="-15" y1="264" x2="395" y2="264" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Boy: 3000 mm -->
    <line x1="0" y1="266" x2="0" y2="302" stroke="#4b5563" stroke-width="1"/>
    <line x1="380" y1="266" x2="380" y2="302" stroke="#4b5563" stroke-width="1"/>
    <line x1="4" y1="292" x2="376" y2="292" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-300)" marker-end="url(#ae-70-300)"/>
    <rect x="145" y="281" width="90" height="20" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="190" y="295" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">3000 mm</text>

    <!-- Yükseklik: 1200 mm -->
    <line x1="-32" y1="0" x2="96" y2="0" stroke="#4b5563" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="-32" y1="264" x2="0" y2="264" stroke="#4b5563" stroke-width="1"/>
    <line x1="-22" y1="4" x2="-22" y2="260" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-300)" marker-end="url(#ae-70-300)"/>
    <rect x="-60" y="121" width="76" height="22" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="-22" y="136" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">1200 mm</text>
  </g>

  <!-- 2. ÜST GÖRÜNÜŞ (3000 x 700 mm -> 270 x 74 px, ÇİFT BACALI) -->
  <g transform="translate(485, 118)">
    <text x="135" y="-18" fill="#9ca3af" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.2">ÜST GÖRÜNÜŞ (TOP PLAN VIEW)</text>
    <rect x="0" y="0" width="270" height="74" fill="url(#sp-70-300)" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="55" y="18" width="160" height="38" fill="#1f2937" stroke="#e5e7eb" stroke-width="1.8"/>
    <circle cx="96" cy="37" r="13" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <circle cx="174" cy="37" r="13" fill="#111827" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <text x="96" y="40" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">BACA 1</text>
    <text x="174" y="40" fill="#38bdf8" font-size="7.5" font-weight="700" text-anchor="middle">BACA 2</text>

    <line x1="0" y1="0" x2="55" y2="18" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="270" y1="0" x2="215" y2="18" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="0" y1="74" x2="55" y2="56" stroke="#d1d5db" stroke-width="1.5"/>
    <line x1="270" y1="74" x2="215" y2="56" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="135" y="69" fill="#fbbf24" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">▼ ÖN CEPHE (AÇIK AĞIZ) ▼</text>

    <line x1="272" y1="0" x2="290" y2="0" stroke="#4b5563" stroke-width="1"/>
    <line x1="272" y1="74" x2="290" y2="74" stroke="#4b5563" stroke-width="1"/>
    <line x1="280" y1="4" x2="280" y2="70" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-300)" marker-end="url(#ae-70-300)"/>
    <rect x="248" y="27" width="64" height="20" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="280" y="41" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">700 mm</text>

    <line x1="4" y1="98" x2="266" y2="98" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#as-70-300)" marker-end="url(#ae-70-300)"/>
    <rect x="95" y="88" width="80" height="19" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="135" y="101" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3000 mm</text>
  </g>

  <g transform="translate(485, 310)">
    <rect x="0" y="0" width="280" height="115" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.6">MODEL: DAV-KMR-70-300_1</text>
    <line x1="16" y1="32" x2="264" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="16" y="52" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Ölçüler:</tspan> 3000 × 700 × 1200 mm</text>
    <text x="16" y="72" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Malzeme:</tspan> AISI 430 Kalite Paslanmaz Çelik</text>
    <text x="16" y="92" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Yapı:</tspan> 3 Metre Tam Boy &amp; 70'lik Derin Seri</text>
    <text x="16" y="108" fill="#9ca3af" font-size="10.5" font-style="italic">* Endüstriyel 3 metrelik kebap/ızgara hatları için maksimum boy.</text>
  </g>

  <line x1="20" y1="455" x2="780" y2="455" stroke="#374151" stroke-width="1"/>
  <text x="25" y="476" fill="#6b7280" font-size="11" font-weight="600">AVŞAR KROM ENDÜSTRİYEL MUTFAK EKİPMANLARI // CAD BLUEPRINT SİSTEMİ</text>
  <text x="775" y="476" fill="#6b7280" font-size="11" font-weight="600" text-anchor="end">KOD: DAV-KMR-70-300_1 | ÖLÇEK: MM</text>
</svg>