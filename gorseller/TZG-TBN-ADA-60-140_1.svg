<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #111827; font-family: &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Izgara (Grid) Deseni -->
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1f2937" stroke-width="0.5" />
    </pattern>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#smallGrid)" />
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#374151" stroke-width="1" />
    </pattern>

    <!-- Ölçü Ok Uçları -->
    <marker id="arrowStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>

    <!-- Paslanmaz Çelik Yüzey Degradesi -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Arka Plan Izgara -->
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Dış Çerçeve ve Antet Başlığı -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#475569" stroke-width="1.5" rx="4" />
  <rect x="15" y="15" width="770" height="42" fill="#1e293b" rx="4" />
  <line x1="15" y1="57" x2="785" y2="57" stroke="#475569" stroke-width="1.5" />

  <text x="30" y="41" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing="1">AVŞAR KROM — TEKNİK ŞEMA (BLUEPRINT)</text>
  <text x="770" y="41" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="end" letter-spacing="0.5">KOD: TZG-TBN-ADA-60-140_1 | 1400x600x850 mm</text>

  <!-- =========================================================
       SOL BÖLÜM: ÖN GÖRÜNÜŞ (FRONT VIEW) - Ölçek: 1mm = 0.22px
       Boy: 1400mm -> 308px | Yükseklik: 850mm -> 187px
       ========================================================= -->
  <g transform="translate(65, 135)">
    <!-- Başlık -->
    <text x="154" y="-35" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>
    <text x="154" y="-19" fill="#64748b" font-size="10" text-anchor="middle">Orta Tip (Sırtsız / Ada Tipi)</text>

    <!-- Sol ve Sağ 40x40mm Ayaklar (850mm yükseklik) -->
    <rect x="0" y="0" width="9" height="181" fill="#334155" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="299" y="0" width="9" height="181" fill="#334155" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Rotil Ayak Pabuçları -->
    <rect x="-1" y="181" width="11" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1" />
    <rect x="298" y="181" width="11" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1" />

    <!-- Ön Üst Kuşak Paneli (200mm -> 44px) -->
    <rect x="9" y="9" width="290" height="44" fill="url(#steelGrad)" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Soğuk Damga Logo (Sol Üst Köşe, Çerçevesiz Tek Satır) -->
    <text x="20" y="24" fill="#94a3b8" font-size="8" font-weight="700" letter-spacing="1.2">AVŞAR KROM</text>

    <!-- Üst Tabla Ön Kırma (40mm -> 9px, Sırtsız Düz Üst Hat) -->
    <rect x="-2" y="0" width="312" height="9" fill="#475569" stroke="#f8fafc" stroke-width="1.8" />

    <!-- Alt Taban Rafı (Yerden 150mm -> 33px yukarıda, kalınlık 35mm -> 8px) -->
    <rect x="9" y="146" width="290" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5" />

    <!-- Zemin Çizgisi -->
    <line x1="-25" y1="187" x2="333" y2="187" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- ÖLÇÜLENDİRME: Üst Boy (1400 mm) -->
    <line x1="0" y1="-5" x2="0" y2="-62" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="308" y1="-5" x2="308" y2="-62" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="4" y1="-55" x2="304" y2="-55" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <rect x="114" y="-65" width="80" height="18" fill="#111827" />
    <text x="154" y="-52" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1400 mm</text>

    <!-- ÖLÇÜLENDİRME: Sol Toplam Yükseklik (850 mm) -->
    <line x1="-5" y1="0" x2="-42" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="-5" y1="187" x2="-42" y2="187" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="-35" y1="4" x2="-35" y2="183" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <g transform="translate(-39, 93) rotate(-90)">
      <rect x="-32" y="-11" width="64" height="15" fill="#111827" />
      <text x="0" y="0" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">850 mm</text>
    </g>

    <!-- ÖLÇÜLENDİRME: Ön Kuşak Yüksekliği (200 mm) -->
    <line x1="312" y1="9" x2="345" y2="9" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="312" y1="53" x2="345" y2="53" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="338" y1="12" x2="338" y2="50" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <text x="346" y="35" fill="#38bdf8" font-size="10" font-weight="600">200 mm (Ön Kuşak)</text>

    <!-- ÖLÇÜLENDİRME: Alt Raf Yerden Yükseklik (150 mm) -->
    <line x1="312" y1="154" x2="345" y2="154" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="312" y1="187" x2="345" y2="187" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="338" y1="157" x2="338" y2="184" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <text x="346" y="174" fill="#38bdf8" font-size="10" font-weight="600">150 mm</text>
  </g>

  <!-- =========================================================
       SAĞ BÖLÜM: ÜST GÖRÜNÜŞ (TOP / PLAN VIEW) - Ölçek: 1mm = 0.20px
       Boy: 1400mm -> 280px | En: 600mm -> 120px
       ========================================================= -->
  <g transform="translate(475, 165)">
    <!-- Başlık -->
    <text x="140" y="-45" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ÜST GÖRÜNÜŞ (PLAN VIEW)</text>
    <text x="140" y="-29" fill="#64748b" font-size="10" text-anchor="middle">4 Kenar 40 mm Düz Kırma (Sırtsız)</text>

    <!-- Üst Tabla Dış Sınırı (1400 x 600 mm -> 280 x 120 px) -->
    <rect x="0" y="0" width="280" height="120" fill="url(#steelGrad)" stroke="#f8fafc" stroke-width="2" />

    <!-- Alt Raf ve İç Büküm İzdüşüm Çizgisi (Kesikli) -->
    <rect x="8" y="8" width="264" height="104" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4" />

    <!-- 4 Köşe 40x40mm Ayak İzdüşümleri -->
    <rect x="4" y="4" width="8" height="8" fill="none" stroke="#94a3b8" stroke-width="1" />
    <rect x="268" y="4" width="8" height="8" fill="none" stroke="#94a3b8" stroke-width="1" />
    <rect x="4" y="108" width="8" height="8" fill="none" stroke="#94a3b8" stroke-width="1" />
    <rect x="268" y="108" width="8" height="8" fill="none" stroke="#94a3b8" stroke-width="1" />

    <!-- Merkez Etiketi -->
    <text x="140" y="56" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">DÜZ ÇALIŞMA TABLASI</text>
    <text x="140" y="72" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle">SIRTSIZ (ADA TİPİ) — TABAN RAFLI</text>

    <!-- Ön Cephe Yön İşareti -->
    <text x="140" y="138" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">▲ ÖN CEPHE (200 mm Kuşak + Logo)</text>

    <!-- ÖLÇÜLENDİRME: Üst Boy (1400 mm) -->
    <line x1="0" y1="-5" x2="0" y2="-20" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="280" y1="-5" x2="280" y2="-20" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="4" y1="-13" x2="276" y2="-13" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <rect x="105" y="-22" width="70" height="14" fill="#111827" />
    <text x="140" y="-11" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">1400 mm</text>

    <!-- ÖLÇÜLENDİRME: Sağ En / Derinlik (600 mm) -->
    <line x1="285" y1="0" x2="305" y2="0" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="285" y1="120" x2="305" y2="120" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="298" y1="4" x2="298" y2="116" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <g transform="translate(302, 60) rotate(-90)">
      <rect x="-28" y="-10" width="56" height="14" fill="#111827" />
      <text x="0" y="0" fill="#38bdf8" font-size="10.5" font-weight="700" text-anchor="middle">600 mm</text>
    </g>
  </g>

  <!-- Alt Teknik Bilgi Çubuğu (Footer) -->
  <rect x="25" y="425" width="750" height="46" fill="#1e293b" stroke="#334155" stroke-width="1" rx="4" />
  <text x="40" y="445" fill="#e2e8f0" font-size="11" font-weight="600">MALZEME & YAPI:</text>
  <text x="142" y="445" fill="#94a3b8" font-size="11">AISI 304 Kalite 1.20 mm Satine Paslanmaz Çelik | 40x40x1.2 mm Kare Profil Ayaklar | Ayarlanabilir Rotil Ayak</text>
  <text x="40" y="463" fill="#e2e8f0" font-size="11" font-weight="600">MODEL DETAYI:</text>
  <text x="142" y="463" fill="#38bdf8" font-size="11">Orta Tip Sırtsız (Ada Tipi) Düz Üst Tabla | Sadece Ön Üst 200 mm Kuşak (Yanlar Açık) | Düz Taban Rafı</text>
</svg>