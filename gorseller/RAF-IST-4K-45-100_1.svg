<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Milimetrik Izgara Deseni -->
    <pattern id="grid-100" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.8"/>
    </pattern>
    <!-- Ölçü Ok Uçları -->
    <marker id="arrow-start-100" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-end-100" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Arka Plan -->
  <rect width="800" height="500" fill="#111827"/>
  <rect width="800" height="500" fill="url(#grid-100)"/>

  <!-- Başlık ve Antet Bloğu -->
  <g font-family="monospace, sans-serif">
    <rect x="20" y="16" width="760" height="44" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="35" y="36" fill="#f8fafc" font-size="14" font-weight="bold">AVŞAR KROM — TEKNİK ÖLÇÜ ŞEMASI (BLUEPRINT)</text>
    <text x="35" y="52" fill="#94a3b8" font-size="11">4 Raflı Paslanmaz Depo ve İstif Rafı | AISI 304 — 40x40 mm Profil</text>
    <text x="765" y="36" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">KOD: RAF-IST-4K-45-100_1</text>
    <text x="765" y="52" fill="#cbd5e1" font-size="11" text-anchor="end">ÖLÇÜ: 1000 × 455 × 1550 mm | 20 kg</text>
  </g>

  <!-- ==================== 1. ÖN GÖRÜNÜŞ (FRONT VIEW) ==================== -->
  <!-- Ölçek: 1 mm = 0.20 px -> Boy: 1000mm = 200px, Yükseklik: 1550mm = 310px -->
  <g transform="translate(80, 95)" font-family="monospace, sans-serif">
    <text x="100" y="-12" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">ÖN GÖRÜNÜŞ (FRONT VIEW)</text>

    <!-- Sol ve Sağ 40x40mm Dikme Profilleri (8px genişlik) -->
    <rect x="0" y="0" width="8" height="302" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="192" y="0" width="8" height="302" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Ayarlanabilir Rotil Ayaklar (8px yükseklik) -->
    <rect x="1" y="302" width="6" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="-1" y="308" width="10" height="2" rx="1" fill="#38bdf8"/>
    <rect x="193" y="302" width="6" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="191" y="308" width="10" height="2" rx="1" fill="#38bdf8"/>

    <!-- 4 Adet Düz Paslanmaz Raf (40mm büküm = 8px) -->
    <!-- 4. Raf (Üst) - Y=0 -->
    <rect x="0" y="0" width="200" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="14" y="6" fill="#cbd5e1" font-size="5" font-weight="bold">AVŞAR KROM</text>

    <!-- 3. Raf (Üst-Orta) - Y=92 -->
    <rect x="0" y="92" width="200" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- 2. Raf (Alt-Orta) - Y=184 -->
    <rect x="0" y="184" width="200" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- 1. Raf (Alt Taban Rafı - Yerden 150mm = 30px yukarıda -> Y=272) -->
    <rect x="0" y="272" width="200" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Zemin Çizgisi -->
    <line x1="-20" y1="310" x2="225" y2="310" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Toplam Boy Ölçüsü (1000 mm) -->
    <line x1="0" y1="335" x2="200" y2="335" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <line x1="0" y1="312" x2="0" y2="342" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="200" y1="312" x2="200" y2="342" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <rect x="65" y="326" width="70" height="16" rx="2" fill="#111827"/>
    <text x="100" y="338" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1000 mm</text>

    <!-- Toplam Yükseklik Ölçüsü (1550 mm) -->
    <line x1="-30" y1="0" x2="-30" y2="310" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <line x1="-36" y1="0" x2="0" y2="0" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="-36" y1="310" x2="0" y2="310" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <g transform="translate(-35, 155) rotate(-90)">
      <rect x="-35" y="-10" width="70" height="15" rx="2" fill="#111827"/>
      <text x="0" y="1" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1550 mm</text>
    </g>

    <!-- Kat Aralığı Ölçüleri (Sağ Taraf) -->
    <line x1="220" y1="8" x2="220" y2="92" stroke="#94a3b8" stroke-width="1" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <text x="228" y="54" fill="#94a3b8" font-size="10">420 mm</text>

    <line x1="220" y1="100" x2="220" y2="184" stroke="#94a3b8" stroke-width="1" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <text x="228" y="146" fill="#94a3b8" font-size="10">420 mm</text>

    <line x1="220" y1="192" x2="220" y2="272" stroke="#94a3b8" stroke-width="1" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <text x="228" y="236" fill="#94a3b8" font-size="10">400 mm</text>

    <line x1="220" y1="280" x2="220" y2="310" stroke="#94a3b8" stroke-width="1"/>
    <text x="228" y="299" fill="#94a3b8" font-size="10">150 mm</text>
  </g>

  <!-- ==================== 2. YAN & ÜST GÖRÜNÜŞ (SIDE & PLAN VIEW) ==================== -->
  <!-- Yan Görünüş (455mm = 91px genişlik, 1550mm = 310px yükseklik) -->
  <g transform="translate(415, 95)" font-family="monospace, sans-serif">
    <text x="45" y="-12" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">YAN GÖRÜNÜŞ</text>

    <!-- Ön ve Arka Dikme Profilleri -->
    <rect x="0" y="0" width="8" height="302" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="83" y="0" width="8" height="302" fill="#334155" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Rotil Ayaklar -->
    <rect x="1" y="302" width="6" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="-1" y="308" width="10" height="2" rx="1" fill="#38bdf8"/>
    <rect x="84" y="302" width="6" height="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <rect x="82" y="308" width="10" height="2" rx="1" fill="#38bdf8"/>

    <!-- 4 Raflı Yan Kesit -->
    <rect x="0" y="0" width="91" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="0" y="92" width="91" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="0" y="184" width="91" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="0" y="272" width="91" height="8" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Yan Derinlik Ölçüsü (455 mm) -->
    <line x1="0" y1="335" x2="91" y2="335" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <line x1="0" y1="312" x2="0" y2="342" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <line x1="91" y1="312" x2="91" y2="342" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2,2"/>
    <rect x="15" y="326" width="61" height="16" rx="2" fill="#111827"/>
    <text x="45.5" y="338" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">455 mm</text>
  </g>

  <!-- Üst Görünüş (Top/Plan View: 1000mm x 455mm -> 200px x 91px) -->
  <g transform="translate(555, 130)" font-family="monospace, sans-serif">
    <text x="100" y="-12" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">ÜST GÖRÜNÜŞ (PLAN VIEW)</text>

    <!-- Düz Sac Raf Yüzeyi -->
    <rect x="0" y="0" width="200" height="91" fill="#1e293b" stroke="#f8fafc" stroke-width="1.8"/>
    <!-- 4 Köşe 40x40mm Dikme İzi -->
    <rect x="0" y="0" width="8" height="8" fill="#38bdf8" opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
    <rect x="192" y="0" width="8" height="8" fill="#38bdf8" opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
    <rect x="0" y="83" width="8" height="8" fill="#38bdf8" opacity="0.4" stroke="#38bdf8" stroke-width="1"/>
    <rect x="192" y="83" width="8" height="8" fill="#38bdf8" opacity="0.4" stroke="#38bdf8" stroke-width="1"/>

    <!-- Yüzey Bilgisi -->
    <text x="100" y="43" fill="#cbd5e1" font-size="10" font-weight="bold" text-anchor="middle">4 KAT DÜZ TABLALI RAF</text>
    <text x="100" y="57" fill="#64748b" font-size="9" text-anchor="middle">1.20 mm AISI 304 Paslanmaz</text>

    <!-- Üst Görünüş Boy Ölçüsü (1000 mm) -->
    <line x1="0" y1="115" x2="200" y2="115" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrow-start-100)" marker-end="url(#arrow-end-100)"/>
    <text x="100" y="130" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">1000 mm</text>

    <!-- Teknik Özellik Özeti Kutusu -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="200" height="105" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" fill="#38bdf8" font-size="10" font-weight="bold">TEKNİK ÖZELLİKLER</text>
      <text x="12" y="38" fill="#e2e8f0" font-size="9.5">• Raf Sayısı: 4 Kat (Düz Sac)</text>
      <text x="12" y="54" fill="#e2e8f0" font-size="9.5">• Dikme Profil: 40×40×1.2 mm</text>
      <text x="12" y="70" fill="#e2e8f0" font-size="9.5">• Raf Bükümü: 40 mm C-Büküm</text>
      <text x="12" y="86" fill="#e2e8f0" font-size="9.5">• Ağırlık: 20 kg | AISI 304</text>
    </g>
  </g>
</svg>