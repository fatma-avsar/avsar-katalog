    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.6">MODEL: DAV-KMR-70-225_1</text>
    <line x1="16" y1="32" x2="264" y2="32" stroke="#374151" stroke-width="1"/>
    <text x="16" y="52" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Ölçüler:</tspan> 2250 × 700 × 1150 mm</text>
    <text x="16" y="72" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Malzeme:</tspan> AISI 430 Kalite Paslanmaz Çelik</text>
    <text x="16" y="92" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Yapı:</tspan> 225 cm Ekstra Uzun &amp; 70'lik Seri</text>
