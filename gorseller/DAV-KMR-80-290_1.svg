    <rect x="94" y="96" width="80" height="19" rx="4" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
    <text x="134" y="109" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">2900 mm</text>
