    <text x="16" y="52" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Ölçüler:</tspan> 2900 × 800 × 1300 mm</text>
    <text x="16" y="72" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Malzeme:</tspan> AISI 430 Kalite Paslanmaz Çelik</text>
    <text x="16" y="92" fill="#e5e7eb" font-size="11.5">• <tspan font-weight="700" fill="#ffffff">Yapı:</tspan> 80'lik Ekstra Derin &amp; 1300 mm Yüksek</text>
    <text x="16" y="108" fill="#9ca3af" font-size="10.5" font-style="italic">* 2.90 m dev ocakbaşı hatları için ekstra yüksek kubbe.</text>
