            const carpan = (u.paraBirimi === 'USD') ? GUNCEL_DOLAR_KURU : 1;
            const eskiTL = (u.eskiFiyat || 0) * carpan;
            const yeniTL = (u.indirimliFiyat || 0) * carpan;
            let indirimOrani = 0;
            if (eskiTL > yeniTL && eskiTL > 0) {
                indirimOrani = Math.round(((eskiTL - yeniTL) / eskiTL) * 100);
            }
            return { eskiTL, yeniTL, indirimOrani };
        }

        // YAPIŞTIRILAN QR ETİKETLERİ KURTARAN AKILLI ARAMA MOTORU
        function akilliUrunBul(arananKod) {
            if (!arananKod) return null;
            const temizKod = decodeURIComponent(arananKod).trim().toUpperCase();
            
            // 1. Tam Eşleşme
            let bulunan = URUNLER.find(item => item.kod.toUpperCase() === temizKod);
            if (bulunan) return bulunan;

            // 2. Sonunda _1 unutulmuşsa (Örn: SLF-NT-MOD-70 -> SLF-NT-MOD-70_1)
            bulunan = URUNLER.find(item => item.kod.toUpperCase() === temizKod + "_1");
            if (bulunan) return bulunan;

            // 3. Tire veya alt çizgi farklarını yok sayarak eşleştir
            const sadelestirilmis = temizKod.replace(/[-_\s]/g, '');
            bulunan = URUNLER.find(item => item.kod.toUpperCase().replace(/[-_\s]/g, '') === sadelestirilmis);
            if (bulunan) return bulunan;

            // 4. Başlangıç kısmı eşleşiyorsa
            bulunan = URUNLER.find(item => item.kod.toUpperCase().startsWith(temizKod) || temizKod.startsWith(item.kod.toUpperCase()));
            return bulunan || null;
        }

        function vitrinFiltrele() {
            const aramaInput = document.getElementById('vitrinArama');
            const arama = aramaInput ? aramaInput.value.toLowerCase() : "";

            document.querySelectorAll('.filtre-btn').forEach(btn => {
                const seciliMi = btn.getAttribute('onclick').includes(`'${aktifFiltre}'`);
                btn.className = `filtre-btn px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap shrink-0 ${seciliMi ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
            });

            const liste = URUNLER.filter(u => {
                const metinUyumu = u.kod.toLowerCase().includes(arama) || u.ad.toLowerCase().includes(arama) || u.olcu.toLowerCase().includes(arama);
                let filtreUyumu = true;
                if (aktifFiltre === 'EVT') filtreUyumu = u.kod.startsWith('EVT-');
                else if (aktifFiltre === 'TZG') filtreUyumu = u.kod.startsWith('TZG-');
                else if (aktifFiltre === 'SRV') filtreUyumu = u.kod.startsWith('SRV-');
                else if (aktifFiltre === 'DAV') filtreUyumu = u.kod.startsWith('DAV-');
                else if (aktifFiltre === 'RAF') filtreUyumu = u.kod.startsWith('RAF-');
                return metinUyumu && filtreUyumu;
            });

            const grid = document.getElementById('vitrinGrid');
            if (!grid) return;

            if (liste.length === 0) {
                grid.innerHTML = `<div class="col-span-full bg-white p-10 rounded-3xl text-center text-slate-400 text-sm border border-slate-200/60">Arama kriterine uygun ürün bulunamadı.</div>`;

<div class="relative w-full bg-slate-100 overflow-hidden">

                            </button>
                            <button onclick="gorselModuDegistir('sema', '${u.kod}')" class="py-2 rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-1.5 ${aktifGorselModu === 'sema' ? 'bg-slate-900 text-sky-400 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                <span>📐</span> <span>Teknik Şema (Blueprint)</span>
                            </button>
                        </div>
                        ` : ''}

                        <!-- ÜRÜN DETAYLARI -->
                        <div class="p-4 sm:p-6">

                            <!-- FİYAT KARTI -->

                            <!-- 2x2 SİMETRİK TEKNİK ÖZELLİK KUTULARI -->

                yonetimPaneliGoster('qr');

                    </div>
                </div>
            `;
            setTimeout(() => document.getElementById('sifreInput').focus(), 100);
        }

        function sifreDogrula() {
            if (document.getElementById('sifreInput').value === YONETICI_SIFRESI) {
                sessionStorage.setItem('avsar_admin_giris', 'evet');
                aktifUrunKodu = null;
                window.history.replaceState({}, document.title, window.location.pathname);
                yonetimPaneliGoster('qr');
            } else {
                document.getElementById('sifreHata').classList.remove('hidden');
            }
        }

        function yoneticiCikis() {
            sessionStorage.removeItem('avsar_admin_giris');
            katalogSayfasinaDon();
        }

        function panoyaKopyala(elemanId, buton) {
            const metin = document.getElementById(elemanId).value;
            navigator.clipboard.writeText(metin);
            const eskiYazi = buton.innerText;
            buton.innerText = "✓ Kopyalandı";
            buton.classList.add("bg-emerald-600", "text-white");
            setTimeout(() => {
                buton.innerText = eskiYazi;
                buton.classList.remove("bg-emerald-600", "text-white");
            }, 1200);
        }

        function yuzdedenFiyatHesapla() {
            const eski = parseFloat(document.getElementById('f_eskiFiyat').value) || 0;
            const yuzde = parseFloat(document.getElementById('f_indirimYuzde').value) || 0;
            if (eski > 0 && yuzde >= 0 && yuzde <= 100) {
                const indirimli = Math.round(eski * (1 - yuzde / 100));
                document.getElementById('f_yeniFiyat').value = indirimli;
            }
        }

        function fiyattanYuzdeHesapla() {
            const eski = parseFloat(document.getElementById('f_eskiFiyat').value) || 0;
            const yeni = parseFloat(document.getElementById('f_yeniFiyat').value) || 0;
            if (eski > yeni && eski > 0) {
                const yuzde = Math.round(((eski - yeni) / eski) * 100);
                document.getElementById('f_indirimYuzde').value = yuzde;
            } else {
                document.getElementById('f_indirimYuzde').value = 0;
            }
        }

                            </div>
                            <div class="flex gap-1.5 items-center">
                                <span class="text-xs font-semibold text-slate-500 w-16 shrink-0">2. Ürün Adı:</span>
                                <input id="kopya_ad" readonly class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-semibold">
                                <button onclick="panoyaKopyala('kopya_ad', this)" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg shrink-0 transition">Kopyala</button>
                            </div>
                            <div class="flex gap-1.5 items-center">
                                <span class="text-xs font-semibold text-slate-500 w-16 shrink-0">3. Kod:</span>
                                <input id="kopya_kod" readonly class="w-full bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-bold">
                                <button onclick="panoyaKopyala('kopya_kod', this)" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-lg shrink-0 transition">Kopyala</button>
                            </div>
                            <div class="flex gap-1.5 items-center">
                                <span class="text-xs font-semibold text-slate-500 w-16 shrink-0">QR Linki:</span>
                                <input id="kopya_link" readonly class="w-full bg-emerald-50 border border-emerald-300 rounded-lg px-2.5 py-1.5 text-[11px] font-bold text-emerald-900">
                                <button onclick="panoyaKopyala('kopya_link', this)" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg shrink-0 transition">Linki Kopyala</button>
                            </div>
                        </div>

                        <!-- ULTRA HD (1920 x 1200 px) 80 x 50 mm CANVAS ETİKET GÖRSELİ -->
                        <div class="bg-slate-100 p-3 sm:p-4 rounded-2xl flex flex-col items-center">
                            <canvas id="etiketCanvas" width="1920" height="1200" class="w-full max-w-[440px] bg-white border-2 border-slate-900 rounded-lg shadow-sm"></canvas>
                            <p class="text-[11px] text-slate-500 mt-2 text-center">📏 <b>80 x 50 mm Ultra HD (1920×1200 px)</b> — Keskin Baskı Kalitesi</p>
                        </div>

                        <div class="grid grid-cols-3 gap-2 mt-4">
                            <button onclick="window.print()" class="bg-slate-900 text-white py-3 rounded-xl text-xs font-bold hover:bg-slate-800">
                                🖨️ Yazdır
                            </button>
                            <button onclick="etiketResimIndir()" class="bg-emerald-600 text-white py-3 rounded-xl text-xs font-bold hover:bg-emerald-700">
                                📥 HD PNG İndir
                            </button>
                            <button id="onizlemeBtn" class="bg-slate-100 text-slate-800 py-3 rounded-xl text-xs font-bold text-center hover:bg-slate-200 flex items-center justify-center">
                                👁️ Önizleme
                            </button>
                        </div>
                    </div>

                    <!-- SEKME 2: 2. FOTOĞRAF (TEKNİK ŞEMA), KİLO VE FİYAT FORMU -->
                    <div id="sekmeEkle" class="${aktifSekme === 'ekle' ? 'block' : 'hidden'}">
                        <div class="bg-blue-50/70 border border-blue-200 p-3.5 rounded-2xl mb-5 flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="text-xs">
                                <span class="font-bold text-slate-800">💵 Aktif Dolar Kuru: 1$ = ${GUNCEL_DOLAR_KURU} ₺</span>
                            </div>
                            <div class="flex items-center gap-2 text-xs">
                                <label class="flex items-center gap-1 font-semibold text-slate-700 cursor-pointer">
                                    <input type="checkbox" id="otoKurCheck" ${AYARLAR.otomatikKur ? 'checked' : ''} onchange="kurAyariDegistir()"> Canlı Kur
                                </label>
                                <input type="number" step="0.1" id="manuelKurInput" value="${AYARLAR.manuelDolarKuru}" ${AYARLAR.otomatikKur ? 'disabled' : ''} 
                                    onchange="kurAyariDegistir()" class="w-20 p-1.5 border rounded-lg text-center font-bold bg-white disabled:opacity-50">
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 mb-6">
                            <h3 class="font-bold text-sm text-slate-900 mb-3">Ürün Ekle / Teknik Şema & Fiyat Güncelle</h3>
                            <div class="space-y-3 text-sm">
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Ürün Kodu *</label>
                                        <input type="text" id="f_kod" placeholder="SRV-CEK-DLP-60_1" class="w-full p-2 border rounded-lg mt-1 uppercase font-bold text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Stok Adedi</label>
                                        <input type="number" id="f_stok" value="1" class="w-full p-2 border rounded-lg mt-1 font-bold text-xs">
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">1. Görsel (Ürün Fotoğrafı) *</label>
                                        <input type="text" id="f_gorsel" placeholder="gorseller/KOD.jpg" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-extrabold text-sky-700">📐 2. Görsel (Teknik Şema / Blueprint)</label>
                                        <input type="text" id="f_semaGorsel" placeholder="gorseller/KOD_sema.svg (Opsiyonel)" class="w-full p-2 border-2 border-sky-300 bg-sky-50/30 rounded-lg mt-1 text-xs font-semibold">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-semibold text-slate-600">Ürün Adı *</label>
                                    <input type="text" id="f_ad" placeholder="Örn: Üst Raflı Çekmeceli ve Dolaplı Servis Tezgahı" class="w-full p-2.5 border rounded-lg mt-1 text-xs font-semibold">
                                </div>

                                <!-- 4 SÜTUNLU OTOMATİK YÜZDE (%) İNDİRİM HESAPLAYICI -->
                                <div class="bg-white p-3 rounded-xl border border-slate-200 grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    <div>
                                        <label class="text-[11px] font-bold text-slate-600">Birim</label>
                                        <select id="f_birim" class="w-full p-2 border rounded-lg mt-1 font-bold text-xs bg-slate-50">
                                            <option value="TL">₺ TL</option>
                                            <option value="USD">$ USD</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-bold text-slate-600">Liste Fiyatı</label>
                                        <input type="number" id="f_eskiFiyat" oninput="yuzdedenFiyatHesapla()" placeholder="300" class="w-full p-2 border rounded-lg mt-1 text-xs font-semibold">
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-extrabold text-blue-600">% İndirim Yaz</label>
                                        <div class="relative mt-1">
                                            <input type="number" id="f_indirimYuzde" oninput="yuzdedenFiyatHesapla()" placeholder="13" class="w-full p-2 pr-6 border-2 border-blue-400 rounded-lg text-xs font-extrabold text-blue-700 bg-blue-50/40">
                                            <span class="absolute right-2 top-2 text-xs font-extrabold text-blue-600">%</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-bold text-emerald-700">Net Satış Fiyatı</label>
                                        <input type="number" id="f_yeniFiyat" oninput="fiyattanYuzdeHesapla()" placeholder="261" class="w-full p-2 border-2 border-emerald-500 rounded-lg mt-1 text-xs font-extrabold text-emerald-800 bg-emerald-50/40">
                                    </div>
                                </div>

                                <!-- ÖLÇÜ, KİLO VE KDV SATIRI -->
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Ölçüler (En×Boy×Yük.)</label>
                                        <input type="text" id="f_olcu" placeholder="1000 × 600 × 1550 mm" class="w-full p-2 border rounded-lg mt-1 text-xs font-bold">
                                    </div>
                                    <div>
                                        <label class="text-xs font-extrabold text-amber-700">⚖️ Ağırlık / Kilo</label>
                                        <input type="text" id="f_kilo" placeholder="Örn: 42 kg" class="w-full p-2 border-2 border-amber-300 bg-amber-50/30 rounded-lg mt-1 text-xs font-extrabold text-slate-900">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">KDV Bilgisi</label>
                                        <select id="f_kdv" class="w-full p-2 border rounded-lg mt-1 text-xs font-semibold bg-white">
                                            <option value="KDV Dahil">KDV Dahil</option>
                                            <option value="+ KDV (Hariç)">+ KDV (Hariç)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Malzeme Kalitesi</label>
                                        <input type="text" id="f_malzeme" value="AISI 304 Paslanmaz" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Sac & Yapı</label>
                                        <input type="text" id="f_kalinlik" value="1.20 mm / Kutu Profil" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-semibold text-slate-600">Teknik Açıklama</label>
                                    <textarea id="f_aciklama" rows="2" class="w-full p-2 border rounded-lg mt-1 text-xs"></textarea>
                                </div>
                                <button onclick="urunKaydet()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
                                    ✅ Ürünü, Şemayı ve Fiyatı Kaydet
                                </button>
                            </div>
                        </div>

                        <h4 class="font-bold text-xs text-slate-500 uppercase mb-2">Kayıtlı Ürünler (${URUNLER.length} Model)</h4>
                        <div class="max-h-64 overflow-y-auto space-y-2 mb-6 pr-1">
                            ${URUNLER.map(u => {
                                const fh = fiyatHesapla(u);
                                return `
                                <div class="flex justify-between items-center bg-white border border-slate-200 p-2.5 rounded-xl text-xs">
                                    <div class="min-w-0 pr-2">
                                        <div class="truncate"><span class="font-bold text-slate-900">${u.kod}</span> - <span class="text-slate-700 font-medium">${u.ad}</span></div>
                                        <div class="text-[11px] text-slate-500 mt-0.5 flex items-center gap-1.5 flex-wrap">
                                            <span>📐 <b>${u.olcu}</b></span>
                                            ${u.semaGorsel ? `| <span class="text-sky-600 font-bold">📐 Şemalı</span>` : ''}
                                            ${u.kilo ? `| <span>⚖️ <b class="text-amber-700">${u.kilo}</b></span>` : ''}
                                            | ${fh.yeniTL > 0 ? `
                                                ${fh.eskiTL > fh.yeniTL ? `<span class="line-through text-slate-400">${formatTL(fh.eskiTL)}</span>` : ''}
                                                <span class="text-emerald-600 font-extrabold">${formatTL(fh.yeniTL)}</span>
                                            ` : '<span class="text-slate-400">Fiyat Yok</span>'}
                                        </div>
                                    </div>
                                    <div class="flex gap-1.5 shrink-0">
                                        <button onclick="urunDoldur('${u.kod}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-md font-semibold">Düzenle</button>
                                        <button onclick="urunSil('${u.kod}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1.5 rounded-md font-semibold">Sil</button>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>

                        <div class="bg-slate-900 text-white p-4 rounded-2xl text-center">
                            <p class="text-xs text-slate-300 mb-2">Değişiklikleri GitHub'a yüklemek için güncel dosyayı indirin:</p>
                            <button onclick="guncelKoduIndir()" class="w-full bg-white text-slate-900 font-bold py-2.5 rounded-xl text-xs hover:bg-slate-100 transition">
                                💾 Güncel index.html Dosyasını İndir
                            </button>
                        </div>
                    </div>

                </div>
            `;
            if (aktifSekme === 'qr' && URUNLER.length > 0) etiketGuncelle();
        }

        function kurAyariDegistir() {
            AYARLAR.otomatikKur = document.getElementById('otoKurCheck').checked;
            AYARLAR.manuelDolarKuru = parseFloat(document.getElementById('manuelKurInput').value) || 49.00;
            veritabaniKaydet();
            sistemiBaslat();
        }

        // ULTRA HD (1920x1200 px) ETİKET ÇİZİM MOTORU — SABİT GITHUB LİNKLİ
        function etiketGuncelle() {
            const seciliKod = document.getElementById('urunSecici').value;
            const u = URUNLER.find(item => item.kod === seciliKod);
            if (!u) return;

            // Bilgisayarda yerel açılsa bile her zaman gerçek GitHub linkini üretir!
            const urunLinki = SABIT_SITE_URL + "?urun=" + u.kod;
            const formatliOlcu = u.olcu.replace(/ x /gi, " * ").replace(/ × /g, " * ");

            document.getElementById('kopya_olcu').value = formatliOlcu;
            document.getElementById('kopya_ad').value = u.ad;
            document.getElementById('kopya_kod').value = "KOD: " + u.kod;
            document.getElementById('kopya_link').value = urunLinki;
            document.getElementById('onizlemeBtn').onclick = () => urunSayfasinaGit(u.kod);

            const gizliKutu = document.getElementById('gizliQrKutu');
            gizliKutu.innerHTML = "";
            new QRCode(gizliKutu, { text: urunLinki, width: 540, height: 540, correctLevel: QRCode.CorrectLevel.M });

            setTimeout(() => {
                const qrCanvas = gizliKutu.querySelector('canvas');
                const canvas = document.getElementById('etiketCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                ctx.imageSmoothingEnabled = false;

                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, 1920, 1200);

                ctx.fillStyle = "#000000";
                ctx.fillRect(48, 42, 1824, 156);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "900 66px Inter, Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("AVŞAR KROM   •   ENDÜSTRİYEL MUTFAK", 960, 144);

                ctx.fillStyle = "#000000";
                ctx.font = "900 96px Inter, Arial, sans-serif";
                ctx.fillText(formatliOlcu, 960, 326);

                let adFontBoyutu = 64;
                ctx.font = `800 ${adFontBoyutu}px Inter, Arial, sans-serif`;
                while (ctx.measureText(u.ad).width > 1800 && adFontBoyutu > 40) {
                    adFontBoyutu -= 2;
                    ctx.font = `800 ${adFontBoyutu}px Inter, Arial, sans-serif`;
                }
                ctx.fillText(u.ad, 960, 428);

                ctx.fillRect(72, 474, 1776, 6);

                ctx.textAlign = "left";
                ctx.font = "900 64px Inter, Arial, sans-serif";
                ctx.fillText("KOD: " + u.kod, 90, 624);

                const celikTuru = (u.malzeme && u.malzeme.includes("430")) ? "AISI 430" : "AISI 304";
                const celikVeKilo = u.kilo ? `ÇELİK: ${celikTuru} (${u.kilo})` : `ÇELİK: ${celikTuru} Paslanmaz`;
                ctx.font = "800 58px Inter, Arial, sans-serif";
                ctx.fillText(celikVeKilo, 90, 795);

                ctx.font = "800 66px Inter, Arial, sans-serif";
                ctx.fillText("TEL: 0532 333 38 06", 135, 975);
                ctx.fillText("MUSTAFA AVŞAR", 174, 1074);

                if (qrCanvas) {
                    ctx.drawImage(qrCanvas, 1275, 540, 555, 555);
                }
            }, 80);
        }

        function etiketResimIndir() {
            const canvas = document.getElementById('etiketCanvas');
            const seciliKod = document.getElementById('urunSecici').value;
            const link = document.createElement('a');
            link.download = `Etiket_HD_80x50_${seciliKod}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        function urunKaydet() {
            const kod = document.getElementById('f_kod').value.trim().toUpperCase();
            const stokAdet = parseInt(document.getElementById('f_stok').value) || 1;
            const ad = document.getElementById('f_ad').value.trim();
            const paraBirimi = document.getElementById('f_birim').value;
            const eskiFiyat = parseFloat(document.getElementById('f_eskiFiyat').value) || 0;
            const indirimliFiyat = parseFloat(document.getElementById('f_yeniFiyat').value) || 0;
            const kdvDurumu = document.getElementById('f_kdv').value;
            const olcu = document.getElementById('f_olcu').value.trim() || "Standart Ölçü";
            
            let kilo = document.getElementById('f_kilo').value.trim();
            if (kilo && !isNaN(kilo.replace(',', '.'))) {
                kilo = kilo + " kg";
            }

            const malzeme = document.getElementById('f_malzeme').value.trim();
            const kalinlik = document.getElementById('f_kalinlik').value.trim();
            const gorsel = document.getElementById('f_gorsel').value.trim() || `gorseller/${kod}.jpg`;
            const semaGorsel = document.getElementById('f_semaGorsel').value.trim();
            const aciklama = document.getElementById('f_aciklama').value.trim();

            if (!kod || !ad) {
                alert("Lütfen Ürün Kodu ve Ürün Adı alanlarını doldurun!");
                return;
            }

            const yeniUrun = { kod, ad, olcu, kilo, stokAdet, malzeme, kalinlik, paraBirimi, eskiFiyat, indirimliFiyat, kdvDurumu, gorsel, semaGorsel, aciklama };
            const mevcutIndex = URUNLER.findIndex(u => u.kod === kod);

            if (mevcutIndex > -1) {
                URUNLER[mevcutIndex] = yeniUrun;
            } else {
                URUNLER.push(yeniUrun);
            }

            veritabaniKaydet();
            yonetimPaneliGoster('ekle');
        }

        function urunDoldur(kod) {
            const u = URUNLER.find(item => item.kod === kod);
            if (!u) return;
            document.getElementById('f_kod').value = u.kod;
            document.getElementById('f_stok').value = u.stokAdet || 1;
            document.getElementById('f_ad').value = u.ad;
            document.getElementById('f_birim').value = u.paraBirimi || 'TL';
            document.getElementById('f_eskiFiyat').value = u.eskiFiyat || '';
            document.getElementById('f_yeniFiyat').value = u.indirimliFiyat || '';
            fiyattanYuzdeHesapla();
            document.getElementById('f_kdv').value = u.kdvDurumu || 'KDV Dahil';
            document.getElementById('f_olcu').value = u.olcu;
            document.getElementById('f_kilo').value = u.kilo || '';
            document.getElementById('f_malzeme').value = u.malzeme;
            document.getElementById('f_kalinlik').value = u.kalinlik;
            document.getElementById('f_gorsel').value = u.gorsel;
            document.getElementById('f_semaGorsel').value = u.semaGorsel || '';
            document.getElementById('f_aciklama').value = u.aciklama;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function urunSil(kod) {
            if (confirm(`${kod} kodlu ürünü silmek istediğinize emin misiniz?`)) {
                URUNLER = URUNLER.filter(u => u.kod !== kod);
                veritabaniKaydet();
                yonetimPaneliGoster('ekle');
            }
        }

        function guncelKoduIndir() {
            const cloneDoc = document.documentElement.cloneNode(true);
            const cloneIcerik = cloneDoc.querySelector('#icerikAlani');
            if (cloneIcerik) cloneIcerik.innerHTML = '';
            
            const cloneQr = cloneDoc.querySelector('#gizliQrKutu');
            if (cloneQr) cloneQr.innerHTML = '';

            cloneDoc.querySelectorAll('[id*="monica"], [class*="monica"], [id*="Plugin-Root"], #intellisense-root').forEach(el => el.remove());
            cloneDoc.querySelectorAll('style:not(:first-of-type)').forEach(el => el.remove());
            let tamHtml = cloneDoc.outerHTML;
            const yeniVeriKodu = `// /*URUNLER_BASLANGIC*/\n        const VARSAYILAN_AYARLAR = ${JSON.stringify(AYARLAR, null, 12)};\n\n        const VARSAYILAN_URUNLER = ${JSON.stringify(URUNLER, null, 12)};\n        // /*URUNLER_BITIS*/`;
            
            tamHtml = tamHtml.replace(/\/\/ \/\*URUNLER_BASLANGIC\*\/[\s\S]*?\/\/ \/\*URUNLER_BITIS\*\//, yeniVeriKodu);
            
            const blob = new Blob(["<!DOCTYPE html>\n" + tamHtml], { type: "text/html;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "index.html";
            link.click();
        }
    </script>
</body>
</html>
