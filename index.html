                            <input type="text" id="vitrinArama" oninput="vitrinFiltrele()" placeholder="Ürün kodu veya ölçü ara (Örn: 1900, EVT)..." 
                                class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition">
                            <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5 w-full md:w-auto justify-center" id="filtreButonlari">
                            <button onclick="seriFiltreSec('Tümü')" class="filtre-btn px-3.5 py-2 rounded-xl text-xs font-bold transition bg-slate-900 text-white">Tümü (${URUNLER.length})</button>
                            <button onclick="seriFiltreSec('60')" class="filtre-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200">60'lık Seri</button>
                            <button onclick="seriFiltreSec('70')" class="filtre-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200">70'lik Seri</button>
                            <button onclick="seriFiltreSec('CFT')" class="filtre-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200">Çift Evyeli</button>
                            <button onclick="seriFiltreSec('BMG')" class="filtre-btn px-3.5 py-2 rounded-xl text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200">Makine Girişli</button>

            `;
            vitrinFiltrele();

        function seriFiltreSec(seri) {
            aktifFiltre = seri;
            vitrinFiltrele();
        }

        function vitrinFiltrele() {
            const aramaInput = document.getElementById('vitrinArama');
            const arama = aramaInput ? aramaInput.value.toLowerCase() : "";

            // Filtre butonlarının rengini güncelle
            document.querySelectorAll('.filtre-btn').forEach(btn => {
                const seciliMi = btn.getAttribute('onclick').includes(`'${aktifFiltre}'`);
                btn.className = `filtre-btn px-3.5 py-2 rounded-xl text-xs font-bold transition ${seciliMi ? 'bg-slate-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
            });

            const liste = URUNLER.filter(u => {
                const metinUyumu = u.kod.toLowerCase().includes(arama) || u.ad.toLowerCase().includes(arama) || u.olcu.toLowerCase().includes(arama);
                let filtreUyumu = true;
                if (aktifFiltre === '60') filtreUyumu = u.kod.includes('-60_');
                else if (aktifFiltre === '70') filtreUyumu = u.kod.includes('-70_');
                else if (aktifFiltre === 'CFT') filtreUyumu = u.kod.includes('-CFT-');
                else if (aktifFiltre === 'BMG') filtreUyumu = u.kod.includes('-BMG-');
                return metinUyumu && filtreUyumu;
            });

            const grid = document.getElementById('vitrinGrid');
            if (!grid) return;

            if (liste.length === 0) {
                grid.innerHTML = `<div class="col-span-full bg-white p-12 rounded-3xl text-center text-slate-400 text-sm border border-slate-200/60">Arama kriterine uygun ürün bulunamadı.</div>`;
                return;
            }

            grid.innerHTML = liste.map((u, idx) => {
                const fh = fiyatHesapla(u);
                return `
                <a href="?urun=${u.kod}" style="animation-delay: ${Math.min(idx * 40, 300)}ms" class="animate-fade-up opacity-0 product-card-hover group bg-white rounded-3xl border border-slate-200/80 overflow-hidden flex flex-col justify-between">
                    <div>
                        <div class="relative aspect-[4/3] bg-slate-100 overflow-hidden">
                            <img src="${u.gorsel}" alt="${u.ad}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                 onerror="this.src='https://placehold.co/800x600/f1f5f9/475569?text=${encodeURIComponent(u.kod)}'">
                            <span class="absolute top-3 left-3 bg-slate-900/90 backdrop-blur-sm text-white text-[11px] font-extrabold px-3 py-1 rounded-full tracking-wider">
                                ${u.kod}
                            </span>
                            <span class="absolute top-3 right-3 bg-white/95 backdrop-blur-sm text-slate-800 text-[11px] font-bold px-2.5 py-1 rounded-full shadow-sm">
                                Stok: ${u.stokAdet || 1} Adet
                            </span>
                        </div>
                        <div class="p-5">
                            <h3 class="font-bold text-slate-900 text-base leading-snug group-hover:text-slate-700 transition mb-2">${u.ad}</h3>
                            <div class="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-xl">
                                <span>📐</span> <span>${u.olcu}</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-5 py-3.5 bg-slate-50/80 border-t border-slate-100 flex justify-between items-center">
                        <span class="text-xs font-bold ${fh.yeniTL > 0 ? 'text-emerald-600 text-sm' : 'text-slate-500'}">
                            ${fh.yeniTL > 0 ? formatTL(fh.yeniTL) : 'Fiyat & Teklif Al'}
                        </span>
                        <span class="text-xs font-bold text-slate-900 group-hover:translate-x-1 transition transform inline-flex items-center gap-1">
                            İncele <span>→</span>
                        </span>
                    </div>
                </a>
            `}).join('');
        }

        // =====================================================
        // 2. MÜŞTERİ TEK ÜRÜN EKRANI (QR OKUTULDUĞUNDA AÇILAN EKRAN)
        // =====================================================

                            <span class="text-[10px] tracking-wider uppercase opacity-95 leading-none">NET</span>

                        </div>` : ''}

            const yoneticiBar = sessionStorage.getItem('avsar_admin_giris') === 'evet' ? `
                <div class="mb-3 flex justify-between items-center bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs">
                    <span>👁️ Müşteri Önizleme Modu</span>
                    <button onclick="window.history.replaceState({}, document.title, window.location.pathname); yonetimPaneliGoster('qr');" class="bg-white text-slate-900 font-bold px-3 py-1 rounded-lg">⬅️ Etiket Paneline Dön</button>
                </div>
            ` : '';

            kutu.innerHTML = `
                <div class="max-w-xl mx-auto animate-fade-up">
                    ${yoneticiBar}
                    <div class="bg-white rounded-3xl shadow-md border border-slate-200/80 overflow-hidden">
                        <div class="relative bg-slate-100 aspect-[4/3] w-full flex items-center justify-center overflow-hidden">
                            <img src="${u.gorsel}" alt="${u.ad}" class="w-full h-full object-cover" 
                                 onerror="this.src='https://placehold.co/800x600/e2e8f0/475569?text=Gorsel+Hazirlaniyor+(${u.kod})'">
                            <span class="absolute top-4 left-4 bg-slate-900/90 text-white text-xs font-bold px-3.5 py-1.5 rounded-full tracking-wider shadow">
                                KOD: ${u.kod}
                            </span>
                            <span class="absolute top-4 right-4 bg-emerald-600/95 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow">
                                Stok: ${u.stokAdet || 1} Adet Hazır
                            </span>
                        </div>

                        <div class="p-6">
                            <h2 class="text-xl font-bold text-slate-900 mb-2">${u.ad}</h2>
                            <p class="text-slate-600 text-sm leading-relaxed mb-5">${u.aciklama}</p>

                            ${fiyatBolumuHTML}

                            <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-2.5 border border-slate-200/60 text-sm">
                                <div class="flex justify-between border-b border-slate-200 pb-2 gap-2">
                                    <span class="text-slate-500 shrink-0">📐 Ölçüler (En x Boy x Yük.)</span>
                                    <span class="font-bold text-slate-900 text-right">${u.olcu}</span>

                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;

        // =====================================================
        // 3. YÖNETİCİ GİRİŞİ VE 80x50 mm ZEBRA PANELİ
        // =====================================================
        function yoneticiGirisKontrol() {
            if (sessionStorage.getItem('avsar_admin_giris') === 'evet') {
                window.history.replaceState({}, document.title, window.location.pathname);
                yonetimPaneliGoster('qr');
                return;
            }
            kutu.innerHTML = `
                <div class="bg-white rounded-3xl p-8 shadow-md border border-slate-200 text-center max-w-sm mx-auto animate-fade-up">
                    <div class="text-2xl mb-2">🔒</div>
                    <h3 class="font-bold text-base text-slate-900 mb-1">Yönetici Girişi</h3>
                    <p class="text-xs text-slate-500 mb-5">Etiket ve fiyat yönetim paneline erişmek için şifrenizi girin.</p>
                    <input type="password" id="sifreInput" placeholder="Yönetici Şifresi" 
                        onkeypress="if(event.key === 'Enter') sifreDogrula()"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm text-center font-bold mb-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
                    <div id="sifreHata" class="hidden text-xs text-red-600 font-semibold mb-3">Hatalı şifre girdiniz!</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="ekraniCiz()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-xs">İptal</button>
                        <button onclick="sifreDogrula()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-xs">Giriş Yap</button>
                    </div>
                </div>
            `;
            setTimeout(() => document.getElementById('sifreInput').focus(), 100);
        }

        function sifreDogrula() {
            if (document.getElementById('sifreInput').value === YONETICI_SIFRESI) {
                sessionStorage.setItem('avsar_admin_giris', 'evet');
                window.history.replaceState({}, document.title, window.location.pathname);
                yonetimPaneliGoster('qr');
            } else {
                document.getElementById('sifreHata').classList.remove('hidden');
            }
        }

        function yoneticiCikis() {
            sessionStorage.removeItem('avsar_admin_giris');
            ekraniCiz();
        }

        function panoyaKopyala(elemanId, buton) {
            const metin = document.getElementById(elemanId).value;
            navigator.clipboard.writeText(metin);
            const eskiYazi = buton.innerText;
            buton.innerText = "✓ Kopyalandı";
            buton.classList.add("bg-emerald-600", "text-white");
            setTimeout(() => {
                buton.innerText = eskiYazi;
                buton.classList.remove("bg-emerald-600", "text-white");
            }, 1200);
        }

        function yonetimPaneliGoster(aktifSekme = 'qr') {
            kutu.innerHTML = `

                                <span class="font-bold text-slate-800">💵 Aktif Dolar Kuru: 1$ = ${GUNCEL_DOLAR_KURU} ₺</span>

                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Ürün Kodu *</label>
                                        <input type="text" id="f_kod" placeholder="EVT-TEK-SAG-60_1" class="w-full p-2 border rounded-lg mt-1 uppercase font-bold text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Stok Adedi</label>
                                        <input type="number" id="f_stok" value="1" class="w-full p-2 border rounded-lg mt-1 font-bold text-xs">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Fotoğraf Yolu</label>
                                        <input type="text" id="f_gorsel" placeholder="gorseller/..." class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-600">Ürün Adı *</label>
                                    <input type="text" id="f_ad" placeholder="Örn: 60'lık Seri Sağdan Tek Evyeli Tezgah" class="w-full p-2.5 border rounded-lg mt-1 text-xs font-semibold">
                                </div>

                                <div class="bg-white p-3 rounded-xl border border-slate-200 grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="text-[11px] font-bold text-slate-600">Para Birimi</label>
                                        <select id="f_birim" class="w-full p-2 border rounded-lg mt-1 font-bold text-xs bg-slate-50">
                                            <option value="TL">₺ Türk Lirası</option>
                                            <option value="USD">$ Dolar</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-bold text-slate-500">Liste Fiyatı</label>
                                        <input type="number" id="f_eskiFiyat" placeholder="20000" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                    <div>
                                        <label class="text-[11px] font-bold text-emerald-700">İndirimli Fiyat</label>
                                        <input type="number" id="f_yeniFiyat" placeholder="17000" class="w-full p-2 border border-emerald-400 rounded-lg mt-1 text-xs font-bold">
                                    </div>
                                </div>

                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">KDV Bilgisi</label>
                                        <select id="f_kdv" class="w-full p-2 border rounded-lg mt-1 text-xs font-semibold bg-white">
                                            <option value="KDV Dahil">KDV Dahil</option>
                                            <option value="+ KDV (Hariç)">+ KDV (Hariç)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Ölçüler (En x Boy x Yük.)</label>
                                        <input type="text" id="f_olcu" placeholder="1500 x 600 x 850 mm" class="w-full p-2 border rounded-lg mt-1 text-xs font-bold">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-slate-600">Sac Kalınlığı</label>
                                        <input type="text" id="f_kalinlik" value="1.20 mm Sac Kalınlığı" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                    </div>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-600">Malzeme Kalitesi</label>
                                    <input type="text" id="f_malzeme" value="AISI 304 Kalite Paslanmaz Çelik" class="w-full p-2 border rounded-lg mt-1 text-xs">
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-slate-600">Teknik Açıklama</label>
                                    <textarea id="f_aciklama" rows="2" class="w-full p-2 border rounded-lg mt-1 text-xs"></textarea>
                                </div>
                                <button onclick="urunKaydet()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition">
                                    ✅ Ürünü ve Fiyatı Kaydet
                                </button>
                            </div>
                        </div>

                        <h4 class="font-bold text-xs text-slate-500 uppercase mb-2">Kayıtlı Ürünler (${URUNLER.length} Model)</h4>
                        <div class="max-h-64 overflow-y-auto space-y-2 mb-6 pr-1">
                            ${URUNLER.map(u => {
                                const fh = fiyatHesapla(u);
                                return `
                                <div class="flex justify-between items-center bg-white border border-slate-200 p-2.5 rounded-xl text-xs">
                                    <div>
                                        <span class="font-bold text-slate-900">${u.kod}</span> - <span class="text-slate-700 font-medium">${u.ad}</span>
                                        <div class="text-[11px] text-slate-500 mt-0.5">
                                            📐 <b>${u.olcu}</b> \vert{} 📦 Stok: <b>${u.stokAdet || 1} Adet</b> | 
                                            <span class="text-emerald-600 font-bold">${fh.yeniTL > 0 ? formatTL(fh.yeniTL) : 'Fiyat Girilmedi'}</span>
                                        </div>
                                    </div>
                                    <div class="flex gap-1.5 shrink-0">
                                        <button onclick="urunDoldur('${u.kod}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-md font-semibold">Düzenle</button>
                                        <button onclick="urunSil('${u.kod}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1.5 rounded-md font-semibold">Sil</button>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>

                        <div class="bg-slate-900 text-white p-4 rounded-2xl text-center">
                            <p class="text-xs text-slate-300 mb-2">Değişiklikleri GitHub'a yüklemek için güncel dosyayı indirin:</p>
                            <button onclick="guncelKoduIndir()" class="w-full bg-white text-slate-900 font-bold py-2.5 rounded-xl text-xs hover:bg-slate-100 transition">
                                💾 Güncel index.html Dosyasını İndir
                            </button>
                        </div>
                    </div>

                </div>
            `;
            if (aktifSekme === 'qr' && URUNLER.length > 0) etiketGuncelle();
        }

        function kurAyariDegistir() {
            AYARLAR.otomatikKur = document.getElementById('otoKurCheck').checked;
            AYARLAR.manuelDolarKuru = parseFloat(document.getElementById('manuelKurInput').value) || 36.50;
            veritabaniKaydet();
            sistemiBaslat();
        }

        // 80 x 50 mm ETİKETİ DOĞRUDAN RESİM (CANVAS) OLARAK ÇİZEN FONKSİYON (Asla Bozulmaz)
        function etiketGuncelle() {
            const seciliKod = document.getElementById('urunSecici').value;
            const u = URUNLER.find(item => item.kod === seciliKod);
            if (!u) return;

            const urunLinki = window.location.origin + window.location.pathname + "?urun=" + u.kod;

            // Hızlı kopyalama kutularını doldur (ZebraDesigner şablonun için)
            document.getElementById('kopya_kod').value = u.kod;
            document.getElementById('kopya_ad').value = u.ad;
            document.getElementById('kopya_olcu').value = "ÖLÇÜ: " + u.olcu.replace(/ x /g, "*");
            document.getElementById('kopya_link').value = urunLinki;
            document.getElementById('onizlemeBtn').href = "?urun=" + u.kod;

            // Gizli kutuda QR üretip Canvas üzerine senin 80x50 ZebraDesigner tasarımını birebir çiz
            const gizliKutu = document.getElementById('gizliQrKutu');
            gizliKutu.innerHTML = "";
            new QRCode(gizliKutu, { text: urunLinki, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });

            setTimeout(() => {
                const qrCanvas = gizliKutu.querySelector('canvas');
                const canvas = document.getElementById('etiketCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                // Beyaz Arka Plan (640x400 px = 80x50 mm oranı)
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, 640, 400);

                // Üst Siyah Kuşak (Ters Baskı)
                ctx.fillStyle = "#000000";
                ctx.fillRect(16, 14, 608, 52);

                ctx.fillStyle = "#FFFFFF";
                ctx.font = "900 22px Inter, Arial, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("AVŞAR KROM   •   ENDÜSTRİYEL MUTFAK", 320, 48);

                // Ortalanmış Ürün Kodu ve Ürün Adı (Senin 80x50 şablonunla birebir aynı)
                ctx.fillStyle = "#000000";
                ctx.font = "900 30px Inter, Arial, sans-serif";
                ctx.fillText(u.kod, 320, 108);

                ctx.font = "800 21px Inter, Arial, sans-serif";
                ctx.fillText(u.ad, 320, 142);

                // İnce Ayırıcı Çizgi
                ctx.fillRect(24, 158, 592, 2);

                // Sol Alt Bilgiler (Ölçü, Çelik, Telefon, Mustafa Avşar)
                ctx.textAlign = "left";
                ctx.font = "800 22px Inter, Arial, sans-serif";
                ctx.fillText("ÖLÇÜ: " + u.olcu.replace(/ x /g, "*"), 30, 208);

                ctx.font = "800 21px Inter, Arial, sans-serif";
                ctx.fillText("ÇELİK: AISI 304 Paslanmaz", 30, 265);

                ctx.font = "800 22px Inter, Arial, sans-serif";
                ctx.fillText("TEL: 0532 333 38 06", 45, 325);
                ctx.fillText("MUSTAFA AVŞAR", 58, 358);

                // Sağ Alt QR Kod
                if (qrCanvas) {
                    ctx.drawImage(qrCanvas, 425, 180, 185, 185);
                }
            }, 60);
        }

        function etiketResimIndir() {
            const canvas = document.getElementById('etiketCanvas');
            const seciliKod = document.getElementById('urunSecici').value;
            const link = document.createElement('a');
            link.download = `Etiket_80x50_${seciliKod}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function urunKaydet() {
            const kod = document.getElementById('f_kod').value.trim().toUpperCase();
            const stokAdet = parseInt(document.getElementById('f_stok').value) || 1;
            const ad = document.getElementById('f_ad').value.trim();
            const paraBirimi = document.getElementById('f_birim').value;
            const eskiFiyat = parseFloat(document.getElementById('f_eskiFiyat').value) || 0;
            const indirimliFiyat = parseFloat(document.getElementById('f_yeniFiyat').value) || 0;
            const kdvDurumu = document.getElementById('f_kdv').value;
            const olcu = document.getElementById('f_olcu').value.trim() || "Standart Ölçü";
            const malzeme = document.getElementById('f_malzeme').value.trim();
            const kalinlik = document.getElementById('f_kalinlik').value.trim();
            const gorsel = document.getElementById('f_gorsel').value.trim() || `gorseller/${kod}.jpg`;
            const aciklama = document.getElementById('f_aciklama').value.trim();

            if (!kod || !ad) {
                alert("Lütfen Ürün Kodu ve Ürün Adı alanlarını doldurun!");
                return;
            }

            const yeniUrun = { kod, ad, olcu, stokAdet, malzeme, kalinlik, paraBirimi, eskiFiyat, indirimliFiyat, kdvDurumu, gorsel, aciklama };
            const mevcutIndex = URUNLER.findIndex(u => u.kod === kod);

            if (mevcutIndex > -1) {
                URUNLER[mevcutIndex] = yeniUrun;
            } else {
                URUNLER.push(yeniUrun);
            }

            veritabaniKaydet();
            yonetimPaneliGoster('ekle');
        }

        function urunDoldur(kod) {
            const u = URUNLER.find(item => item.kod === kod);
            if (!u) return;
            document.getElementById('f_kod').value = u.kod;
            document.getElementById('f_stok').value = u.stokAdet || 1;
            document.getElementById('f_ad').value = u.ad;
            document.getElementById('f_birim').value = u.paraBirimi || 'TL';
            document.getElementById('f_eskiFiyat').value = u.eskiFiyat || '';
            document.getElementById('f_yeniFiyat').value = u.indirimliFiyat || '';
            document.getElementById('f_kdv').value = u.kdvDurumu || 'KDV Dahil';
            document.getElementById('f_olcu').value = u.olcu;
            document.getElementById('f_malzeme').value = u.malzeme;
            document.getElementById('f_kalinlik').value = u.kalinlik;
            document.getElementById('f_gorsel').value = u.gorsel;
            document.getElementById('f_aciklama').value = u.aciklama;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function urunSil(kod) {
            if (confirm(`${kod} kodlu ürünü silmek istediğinize emin misiniz?`)) {
                URUNLER = URUNLER.filter(u => u.kod !== kod);
                veritabaniKaydet();
                yonetimPaneliGoster('ekle');
            }
        }

        function guncelKoduIndir() {
            const cloneDoc = document.documentElement.cloneNode(true);
            const cloneIcerik = cloneDoc.querySelector('#icerikAlani');
            if (cloneIcerik) cloneIcerik.innerHTML = '';

            let tamHtml = cloneDoc.outerHTML;
            const yeniVeriKodu = `// /*URUNLER_BASLANGIC*/\n        const VARSAYILAN_AYARLAR = ${JSON.stringify(AYARLAR, null, 12)};\n\n        const VARSAYILAN_URUNLER = ${JSON.stringify(URUNLER, null, 12)};\n        // /*URUNLER_BITIS*/`;
            
            tamHtml = tamHtml.replace(/\/\/ \/\*URUNLER_BASLANGIC\*\/[\s\S]*?\/\/ \/\*URUNLER_BITIS\*\//, yeniVeriKodu);
            
            const blob = new Blob(["<!DOCTYPE html>\n" + tamHtml], { type: "text/html;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "index.html";
            link.click();
        }
    </script>
</body>
</html>
